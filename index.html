<meta charset="utf-8">
<title>선박 현장 분해도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root {
  --ink: #16171A;
  --muted: #66655F;
  --glass: rgb(255 255 255 / .74);
  --edge: rgb(22 23 26 / .1);
  --accent: #F2B300;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 42%, #F9F8F4 0%, #E7E5DF 60%, #D6D3CB 100%);
  color: var(--ink);
  font: 400 15px/1.6 var(--sans);
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#view:focus-visible { box-shadow: inset 0 0 0 3px var(--ink); }

.head {
  position: fixed;
  top: calc(22px + env(safe-area-inset-top, 0px));
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  pointer-events: none;
}
.head > * { pointer-events: auto; }
.eyebrow {
  margin: 0 0 8px;
  font: 500 11px/1 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
/* 제목을 누르면 박스 목록이 위에서 아래로 펼쳐지는 메뉴 */
.picker { position: relative; }
.title {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  border: 0;
  background: none;
  font-size: clamp(22px, 2.6vw, 32px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.02em;
  text-align: left;
  cursor: pointer;
}
.chev {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: var(--glass);
  transition: transform .4s cubic-bezier(.2, .8, .2, 1), background .2s;
}
.chev svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.title:hover .chev { background: #fff; }
.picker.open .chev { transform: rotate(180deg); }
.menu {
  position: absolute;
  top: calc(100% + 12px);
  left: 0;
  z-index: 5;
  width: max-content;
  min-width: 100%;
  max-width: calc(100vw - 36px);
  margin: 0;
  padding: 6px;
  list-style: none;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: rgb(255 255 255 / .9);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: 0 18px 40px rgb(22 23 26 / .14);
  clip-path: inset(0 0 100% 0 round 14px);
  visibility: hidden;
  transition: clip-path .26s cubic-bezier(.4, 0, .2, 1), visibility 0s linear .26s;
}
.picker.open .menu {
  clip-path: inset(0 0 0 0 round 14px);
  visibility: visible;
  transition: clip-path .5s cubic-bezier(.2, .8, .2, 1), visibility 0s;
}
.menu li { opacity: 0; transform: translateY(-12px); transition: opacity .15s, transform .15s; }
.picker.open .menu li {
  opacity: 1;
  transform: none;
  transition: opacity .35s ease calc(.08s + var(--i) * .07s), transform .5s cubic-bezier(.2, .8, .2, 1) calc(.08s + var(--i) * .07s);
}
.opt {
  appearance: none;
  display: grid;
  gap: 3px;
  width: 100%;
  padding: 11px 16px 11px 14px;
  border: 0;
  border-radius: 10px;
  background: none;
  text-align: left;
  cursor: pointer;
  transition: background .15s;
}
.opt:hover { background: rgb(22 23 26 / .05); }
.menu-gap { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--edge); }
.opt[aria-current="page"] { background: rgb(242 179 0 / .14); box-shadow: inset 3px 0 0 var(--accent); }
.opt-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
.opt-meta { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sub { margin: 8px 0 0; font-size: 13px; color: var(--muted); transition: opacity .25s; }
.picker.open + .sub { opacity: 0; }
.act {
  appearance: none;
  flex: none;
  padding: 12px 18px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 8px 20px rgb(22 23 26 / .2);
}
.act:hover { background: #2B2D32; }

.hint {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  margin: 0;
  padding: 10px 16px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  pointer-events: none;
}
body.focus .hint { display: none; }

.info {
  position: fixed;
  left: 28px;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100% - 56px));
  padding: 20px 22px;
  border: 1px solid var(--edge);
  border-radius: 16px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: 0 16px 40px rgb(22 23 26 / .12);
}
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.badge {
  display: grid;
  place-items: center;
  flex: none;
  width: 30px;
  height: 30px;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  background: var(--accent);
  font: 600 12px/1 var(--mono);
}
.count { font-size: 12px; font-weight: 600; color: var(--muted); }
.info h2 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
.en { margin: 2px 0 0; font: 500 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.desc { margin: 12px 0 0; }
.how { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
.nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn {
  appearance: none;
  padding: 9px 13px;
  border: 1px solid var(--edge);
  border-radius: 9px;
  background: rgb(255 255 255 / .85);
  font-weight: 600;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.btn:hover { border-color: var(--ink); }
.btn.back { margin-left: auto; }

.tip {
  position: fixed;
  left: 0;
  top: 0;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;
  transform: translate(-50%, calc(-100% - 14px));
}
.fail { position: fixed; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: var(--muted); }

/* 메인 화면: 현장 세 곳을 왼쪽·가운데·오른쪽 칸으로 (세로 화면에서는 위·가운데·아래). 3D는 뒤 캔버스에 칸별로 그린다 */
.home {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  visibility: hidden;
  opacity: 0;
  transition: opacity .2s, visibility 0s linear .2s;
}
body.mainview .home { visibility: visible; opacity: 1; transition: opacity .5s ease .1s, visibility 0s; }
.panel {
  appearance: none;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-start;
  gap: 5px;
  min-width: 0;
  padding: 0 28px calc(36px + env(safe-area-inset-bottom, 0px));
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: background .3s;
}
.panel + .panel { border-left: 1px solid var(--edge); }
.panel:hover, .panel:focus-visible { background: rgb(255 255 255 / .18); }
.panel:focus-visible { outline: 2px solid var(--ink); outline-offset: -6px; }
.p-no { font: 500 11px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
.p-name { font-size: clamp(18px, 1.7vw, 24px); font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.p-box { font-size: 13px; color: var(--muted); }
.p-go {
  margin-top: 10px;
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1;
  transition: transform .25s cubic-bezier(.2, .8, .2, 1);
}
.panel:hover .p-go, .panel:focus-visible .p-go { transform: translateX(5px); }
body.mainview .hint, body.mainview .actions { display: none; }
@media (max-aspect-ratio: 85/100) {
  .home { top: var(--home-top, 110px); grid-template-columns: 1fr; grid-template-rows: repeat(3, 1fr); }
  .panel { justify-content: center; gap: 3px; padding: 0 18px; }
  .panel + .panel { border-left: 0; border-top: 1px solid var(--edge); }
  .p-go { margin-top: 6px; padding: 7px 11px; }
}

/* 오른쪽 위 버튼 묶음: [처음으로] [← ○○ 현장으로] [분해하기/다시 조립] */
.actions { flex: none; display: flex; align-items: center; gap: 8px; }
.crumb {
  appearance: none;
  padding: 11px 16px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
}
.crumb:hover { border-color: var(--ink); background: #fff; }

/* 배가 분해되면 아래에서 올라오는 설치 장소 선택지 세 개 */
.choices {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: grid;
  justify-items: center;
  gap: 10px;
  width: max-content;
  max-width: calc(100% - 24px);
  visibility: hidden;
  pointer-events: none;
  transition: visibility 0s linear .3s;
}
.choices-label { margin: 0; font-size: 12.5px; font-weight: 600; line-height: 1; color: var(--muted); opacity: 0; transition: opacity .2s; }
.choice-row { display: flex; gap: 10px; }
.choice {
  appearance: none;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 212px;
  padding: 12px 18px 12px 12px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: rgb(255 255 255 / .84);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: 0 12px 30px rgb(22 23 26 / .12);
  text-align: left;
  cursor: pointer;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity .2s, transform .2s, border-color .15s;
}
.choice:hover { border-color: var(--ink); }
.choice .badge { width: 28px; height: 28px; }
.c-name { display: block; font-size: 15px; font-weight: 700; line-height: 1.3; }
.c-place { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
body.field.exploded .choices { visibility: visible; pointer-events: auto; transition: visibility 0s; }
body.field.exploded .choices-label { opacity: 1; transition: opacity .4s ease .5s; }
body.field.exploded .choice {
  opacity: 1;
  transform: none;
  transition: opacity .4s ease calc(.55s + var(--i) * .1s), transform .6s cubic-bezier(.2, .8, .2, 1) calc(.55s + var(--i) * .1s), border-color .15s;
}
body.field.exploded .hint, body.site .hint { display: none; }

/* 분해된 배 위에 박스 자리를 알려 주는 번호 핀 */
.pins { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s; }
body.field.exploded .pins { opacity: 1; transition: opacity .5s ease .9s; }
.pin {
  position: absolute;
  left: 0;
  top: 0;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  font: 600 12px/1 var(--mono);
  box-shadow: 0 0 0 3px rgb(255 255 255 / .75);
  transform: translate(-50%, calc(-100% - 14px));
}
.pin::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 14px; background: var(--ink); transform: translateX(-50%); }

@media (max-width: 640px) {
  .head { top: calc(16px + env(safe-area-inset-top, 0px)); left: 18px; right: 18px; }
  .title { font-size: 20px; gap: 8px; }
  .chev { width: 24px; height: 24px; }
  .sub { font-size: 12px; }
  .act { padding: 10px 14px; font-size: 13px; }
  /* 휴대폰에서는 두 버튼을 오른쪽 위에 세로로 쌓는다 (분해하기가 위) */
  .actions { flex-direction: column-reverse; align-items: flex-end; }
  .crumb { padding: 9px 13px; font-size: 13px; }
  .info { left: 12px; right: 12px; width: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 16px 18px; }
  .info h2 { font-size: 20px; }
  .desc { font-size: 14px; }
  .choices { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .choice-row { flex-direction: column; gap: 8px; }
  .choice { min-width: 0; width: calc(100vw - 24px); padding: 10px 14px 10px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .menu, .menu li, .picker.open .menu, .picker.open .menu li, .chev, .choice, .choices-label, .pins, .home, .panel, .p-go { transition: none !important; }
}
</style>

<canvas id="view" tabindex="0" aria-label="방폭박스 3D 뷰어. Enter 키로 분해하고, 좌우 화살표로 부품을 넘기고, Esc로 돌아갑니다."></canvas>

<div class="home" id="home" role="group" aria-label="산업 현장 고르기">
  <button type="button" class="panel"><span class="p-no">01 · SHIP</span><span class="p-name">선박 현장</span><span class="p-box">내압형 방폭박스 · Ex d</span><span class="p-go">들어가기 →</span></button>
  <button type="button" class="panel"><span class="p-no">02 · OFFSHORE</span><span class="p-name">해양플랜트 현장</span><span class="p-box">본질안전 방폭박스 · Ex i</span><span class="p-go">들어가기 →</span></button>
  <button type="button" class="panel"><span class="p-no">03 · CHEMICAL</span><span class="p-name">화학공장 현장</span><span class="p-box">양압형 방폭박스 · Ex p</span><span class="p-go">들어가기 →</span></button>
</div>

<header class="head">
  <div>
    <p class="eyebrow" id="eyebrow">Exploded View</p>
    <div class="picker" id="picker">
      <button type="button" class="title" id="title" aria-expanded="false" aria-controls="menu">
        <span id="title-text">선박 현장 분해도</span>
        <span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <ul class="menu" id="menu" aria-label="화면 고르기">
        <li style="--i:0"><button type="button" class="opt" data-product="home"><span class="opt-name">메인 화면</span><span class="opt-meta">Main · 3 Sites</span></button></li>
        <li style="--i:1" class="menu-gap"><button type="button" class="opt" data-product="ship"><span class="opt-name">선박 현장 분해도</span><span class="opt-meta">Site · Ship · Ex d</span></button></li>
        <li style="--i:2"><button type="button" class="opt" data-product="offshore"><span class="opt-name">해양플랜트 현장 분해도</span><span class="opt-meta">Site · Offshore · Ex i</span></button></li>
        <li style="--i:3"><button type="button" class="opt" data-product="chem"><span class="opt-name">화학공장 현장 분해도</span><span class="opt-meta">Site · Chemical Plant · Ex p</span></button></li>
        <li style="--i:4" class="menu-gap"><button type="button" class="opt" data-product="is"><span class="opt-name">본질안전 방폭박스 분해도</span><span class="opt-meta">Intrinsic Safety · Ex i</span></button></li>
        <li style="--i:5"><button type="button" class="opt" data-product="exd"><span class="opt-name">내압형 방폭박스 분해도</span><span class="opt-meta">Flameproof · Ex d</span></button></li>
        <li style="--i:6"><button type="button" class="opt" data-product="ep"><span class="opt-name">양압형 방폭박스 분해도</span><span class="opt-meta">Pressurized · Ex p</span></button></li>
      </ul>
    </div>
    <p class="sub" id="sub">참고 이미지를 바탕으로 직접 모델링한 단순화 3D</p>
  </div>
  <div class="actions">
    <button type="button" class="crumb" id="to-start" hidden>처음으로</button>
    <button type="button" class="crumb" id="to-ship" hidden>← 선박 현장으로</button>
    <button type="button" class="act" id="act">분해하기</button>
  </div>
</header>

<p class="hint" id="hint" aria-live="polite">박스를 클릭하면 분해돼요</p>

<section class="info" id="info" aria-live="polite" hidden>
  <div class="row"><span class="badge" id="i-no"></span><span class="count" id="i-count"></span></div>
  <h2 id="i-ko"></h2>
  <p class="en" id="i-en"></p>
  <p class="desc" id="i-desc"></p>
  <p class="how" id="i-how"></p>
  <div class="nav">
    <button type="button" class="btn" data-step="-1" id="prev">← 이전</button>
    <button type="button" class="btn" data-step="1" id="next">다음 →</button>
    <button type="button" class="btn back" id="back">전체 부품</button>
  </div>
</section>

<nav class="choices" id="choices" aria-label="방폭박스 설치 장소">
  <p class="choices-label">이 현장의 방폭박스</p>
  <div class="choice-row">
    <button type="button" class="choice" id="choice" style="--i:0"><span class="badge">Ex</span><span><span class="c-name" id="c-name"></span><span class="c-place" id="c-place"></span></span></button>
  </div>
</nav>
<div class="pins" id="pins" aria-hidden="true"><span class="pin" id="pin">Ex</span></div>

<div class="tip" id="tip" hidden></div>
<p class="fail" id="fail" hidden>3D 화면을 불러오지 못했어요. 인터넷 연결을 확인하거나 다른 브라우저로 열어 주세요.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const fail = () => { $('fail').hidden = false; $('hint').hidden = true; $('act').hidden = true; };
  if (!window.THREE) return fail();
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: $('view'), antialias: true, alpha: true });
  } catch (err) {
    return fail();
  }
  const canvas = renderer.domElement;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const V2 = (x, y) => new THREE.Vector2(x, y);
  const Q = (x = 0, y = 0, z = 0) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z));
  const TM = (p, q = new THREE.Quaternion(), s = 1) => new THREE.Matrix4().compose(p, q, V(s, s, s));
  const at = (x, y, z, q) => TM(V(x, y, z), q);
  const col = h => new THREE.Color(h).convertSRGBToLinear();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const deg = THREE.MathUtils.degToRad;

  const scene = new THREE.Scene();
  const TAN = Math.tan(deg(15));
  const camera = new THREE.PerspectiveCamera(30, 1, .5, 200);

      { key: 'cable', build: makeCable(.415, .03, MAT.cableBlue), ko: '신호 케이블', en: 'IS Signal Cable', desc: '현장 계기의 신호를 싣고 글랜드를 지나 들어온 케이블이에요. 본질안전 회로의 케이블은 다른 회로와 헷갈리지 않게 하늘색으로 구분합니다.', hero: [.3, 0, .6], rest: [0, 0, Math.PI / 2] },

    // 조립 상태에서 각 부품의 자리(박스 기준 좌표), 분해될 때 먼저 빠져나가는 방향, 소속 묶음

      V(sx * SC, sy * SC, .117).applyQuaternion(doorQ).add(doorPos),

    [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sy]) => add('bracket', V(sx * 1.91, sy * 1.15, -D / 2 + .035), sx > 0 ? Q() : Q(0, 0, Math.PI), V(sx, sy * .6, -.3)));
    [.6, -.35].forEach(y => add('rail', V(-.15, y, zRail), Q(), V(0, y * .5, 2.1)));
    [.6, -.35].forEach((y, r) => {
      const grp = `단자대 ${r ? '아래' : '위'} 줄`, dy = y > 0 ? .35 : -.35, rowPos = x => V(-.15 + x, y, zTerm);
      add('stop', rowPos(-.95), Q(), V(-1.15, dy, 3.1), grp);
      add('plate', rowPos(-.879), Q(), V(-.95, dy, 3.1), grp);
      for (let i = 0; i < NB; i++) add('block', rowPos((i - 7.5) * PITCH), Q(), V((i - 7.5) * .07, dy, 3.1), grp);
      add('plate', rowPos(.879), Q(), V(.95, dy, 3.1), grp);

    const barPos = V(1.2, .05, zRail + .185);

    [1, -1].forEach(s => add('support', barPos.clone().add(V(0, s * 1.02, -.085)), Q(), V(.45, s * .55, 1.7), '세로 커넥터'));
    for (let i = 0; i < 12; i++) {

    // 글랜드 부품은 글랜드 축을 따라 곧게 빠진다: 바깥 부품은 아래로, 상자 안쪽의 로크 너트는 위로 풀려 나온다.
    // 케이블은 캡 너트 밖까지 완전히 빠져나온다 (로크 너트는 아래 덕트가 앞으로 빠진 뒤에 움직이도록 분해 순서를 늦춘다)
    GX.forEach((x, n) => {
      const grp = `케이블 글랜드 ${n + 1}번`;
      GP.forEach((key, j) => add(key, V(x, -H / 2, .05), Q(Math.PI, 0, 0), key === 'lnut' ? V(0, .38, 0) : V(0, -.45 - GOFF[j], 0), grp));
      add('cable', V(x, -1.5125, .05), Q(), V(0, -2.1, 0), grp);

    // 도어 명판: 도어 윗 테두리 띠에 붙어 도어와 함께 움직인다. 접지 단자는 왼쪽 벽에서 옆으로 빠진다
    add('nameplate', V(0, 1.345, .121).applyQuaternion(doorQ).add(doorPos), doorQ.clone(), V(0, 0, .6).applyQuaternion(doorQ).add(doorBoom));
    add('earth', V(-W / 2 - .05, EARTH_Y, EARTH_Z), Q(0, 0, Math.PI / 2), V(-.8, 0, 0));
    // 배선 덕트: 앞으로 곧게 빠진다 (커버가 먼저, 멀리)

      types, spec, asm: { p: V(-.8, -.1, 0), q: Q(.16, .42, 0) },
      // 분해 배치는 부품 크기를 재서 줄을 맞춰 자동으로 놓는다 (breaks = 새 줄을 시작하는 부품)
      pack: ['body', 'door', 'bracket', 'hinge', 'nameplate', 'earth', 'screw', 'cap', 'seal', 'cage', 'gbody', 'oring', 'lnut', 'cable', 'duct', 'ductCover', 'rail', 'strip', 'support', 'clip', 'stop', 'plate', 'block'],
      breaks: ['nameplate', 'cap', 'duct', 'clip', 'stop'],
      order: ['door', 'screw', 'nameplate', 'hinge', 'ductCover', 'duct', 'cap', 'seal', 'cage', 'gbody', 'oring', 'cable', 'earth', 'lnut', 'bracket', 'clip', 'strip', 'support', 'stop', 'plate', 'block', 'rail', 'body'],
    };
  }

  // =====================================================================
  // 제품 2: 내압형 방폭박스 (검토용 — 모양과 부품 나누기 중심, 재질은 기본값)
  // =====================================================================
  function productExd() {
    const EW = 2.8, EH = 3.6, ED = 1.5, ET = .12;   // 뒤쪽 몸통 바깥 크기, 깊이, 뒤판 두께
    const FW = 3.3, FH = 4.1, FT = .14;             // 앞쪽 넓은 테두리(플랜지)
    const OW = 2.4, OH = 3.2;                       // 안쪽 공간 입구
    const NBX = 14, floorZ = -FT - ED;              // 줄당 터미널 블록 수, 안쪽 바닥 면
    const HX = -FW / 2 - .07, HZ = .11, HINGES = [1.3, -1.3];   // 경첩 축
    const BOLTS = [
      ...[-1.1, -.37, .37, 1.1].flatMap(x => [[x, 1.825], [x, -1.825]]),
      ...[1.2, 0, -1.2].flatMap(y => [[-1.425, y], [1.425, y]]),
    ];

    // 뒷몸통: 테두리를 C자로 뽑고(위 가운데는 비움), 그 자리에 케이블 입구 3개가 실제로 뚫린 윗판을 끼운다 (본질안전 박스와 같은 방식).
    // 입구는 벽을 따라 위에서 내려오는 전선관을 받는 자리라 뒤쪽(벽 쪽)에 둔다. 윗벽 양 끝에는 아이볼트 보스, 오른쪽 벽에 접지 보스, 바닥에 배출구 보스
    const RBZ = -FT - ED / 2, X0 = .9, TOPZ = -.46, TOPX = [-.55, 0, .55], TR = .1, EYEX = 1.05, EARTH = [-1.2, RBZ], BRX = .6;
    const OX = (EW - .06) / 2, OY = (EH - .06) / 2, IX = (OW + .06) / 2, IY = (OH + .06) / 2;
    const OXo = OX + .03, OYo = OY + .03, IYi = IY - .03;   // 둥글림(.03)까지 더한 실제 바깥면·안쪽면 (벽 두께 .2)
    const shellGeo = () => memo('exShell', () => {
      const R = .24, r = .28, c = new THREE.Shape();
      c.moveTo(-X0, OY);
      c.lineTo(-OX + R, OY); c.quadraticCurveTo(-OX, OY, -OX, OY - R);
      c.lineTo(-OX, -OY + R); c.quadraticCurveTo(-OX, -OY, -OX + R, -OY);
      c.lineTo(OX - R, -OY); c.quadraticCurveTo(OX, -OY, OX, -OY + R);
      c.lineTo(OX, OY - R); c.quadraticCurveTo(OX, OY, OX - R, OY);
      c.lineTo(X0, OY); c.lineTo(X0, IY);
      c.lineTo(IX - r, IY); c.quadraticCurveTo(IX, IY, IX, IY - r);
      c.lineTo(IX, -IY + r); c.quadraticCurveTo(IX, -IY, IX - r, -IY);
      c.lineTo(-IX + r, -IY); c.quadraticCurveTo(-IX, -IY, -IX, -IY + r);
      c.lineTo(-IX, IY - r); c.quadraticCurveTo(-IX, IY, -IX + r, IY);
      c.lineTo(-X0, IY); c.closePath();
      const hz = ED / 2 - .03, top = new THREE.Shape([V2(-X0, -hz), V2(X0, -hz), V2(X0, hz), V2(-X0, hz)]);
      for (const x of TOPX) top.holes.push(circle(TR + .03, x, TOPZ));
      return merge([
        [pinX(extrude(c, ED, .03, 4), (x, y) => y > 1.45 && Math.abs(x) < X0 ? Math.sign(x) * X0 : x)],
        [pinX(extrude(top, OYo - IYi, .03, 4).rotateX(Math.PI / 2).translate(0, (OY + IY) / 2, 0), x => Math.abs(x) > X0 ? Math.sign(x) * X0 : x)],
      ]);
    });
    function makeBody() {
      const g = new THREE.Group();
      const flange = rrect(FW - .04, FH - .04, .18);
      flange.holes.push(rrect(OW + .04, OH + .04, .27));
      for (const [x, y] of BOLTS) flange.holes.push(circle(.07, x, y));
      g.add(mesh(extrude(flange, FT, .02), MAT.alu, V(0, 0, -FT / 2)));
      g.add(mesh(shellGeo(), MAT.alu, V(0, 0, RBZ)));
      g.add(mesh(rbox(EW, EH, ET, .26, .03), MAT.alu, V(0, 0, floorZ - ET / 2)));
      g.add(mesh(memo('exBosses', () => merge([
        ...[-1, 1].map(s => [lathe([[.035, 0], [.08, 0], [.08, .06], [.035, .06], [.035, 0]], 40), at(s * EYEX, OYo, RBZ)]),
        [lathe([[.026, 0], [.065, 0], [.065, .05], [.026, .05], [.026, 0]], 40).rotateZ(-Math.PI / 2), at(OXo, EARTH[0], EARTH[1])],
        [lathe([[.04, 0], [.075, 0], [.075, .05], [.04, .05], [.04, 0]], 40).rotateX(Math.PI), at(BRX, -OYo, RBZ)],
      ])), MAT.alu));
      g.add(mesh(memo('exEntryBores', () => merge([
        ...TOPX.map(x => [liner(TR - .001, IYi, OYo), at(x, 0, RBZ + TOPZ)]),
        ...[-1, 1].map(s => [liner(.035, -.1, .06, true), at(s * EYEX, OYo, RBZ)]),
        [liner(.026, -.1, .05, true).rotateZ(-Math.PI / 2), at(OXo, EARTH[0], EARTH[1])],
        [liner(.04, -.1, .05, true).rotateX(Math.PI), at(BRX, -OYo, RBZ)],
      ])), MAT.lining));
      // 볼트가 들어가는 나사 구멍 안쪽
      g.add(mesh(merge(BOLTS.map(([x, y]) => [new THREE.CylinderGeometry(.048, .048, .1, 24).rotateX(Math.PI / 2), at(x, y, -.05)])), MAT.lining));
      // 경첩: 핀이 지나가는 구멍이 뚫린 통 + 통을 몸체에 잇는 귀(구멍을 막지 않도록 안쪽에만 붙는다)
      for (const h0 of HINGES) {
        const k = V(HX, h0 - .14, HZ);
        g.add(mesh(knuckle(), MAT.alu, k), mesh(knuckleBore(), MAT.lining, k));
        g.add(mesh(memo('exLug', () => rbox(.08, .26, .3, .03, .015)), MAT.alu, V(-FW / 2 + .01, h0 - .14, -.02)));
      }
      // 안쪽 바닥의 접지 스터드(나사산 + 너트)
      const stud = V(-.95, -1.45, floorZ);
      g.add(mesh(memo('exStud', () => merge([
        [threadGeo({ r: .018, depth: .004, pitch: .01, y0: 0, y1: .14 })],
        [lathe([[.018, .14], [.001, .14]], 24)],
        [hexPrism(.045, .018, .025, .0245, .004)],
        [lathe([[.03, 0], [.045, 0], [.045, .012], [.03, .012], [.03, 0]], 32)],
      ]).applyMatrix4(TM(stud, toZ))), MAT.steel));
      return g;
    }
    const knuckle = () => memo('exKnuckle', () => lathe([[.032, -.13], [.07, -.13], [.07, .13], [.032, .13]], 40));
    const knuckleBore = () => memo('exKnuckleBore', () => liner(.032, -.13, .13));
    function makeDoor() {
      const g = new THREE.Group();
      const plate = rrect(FW - .06, FH - .06, .17);
      for (const [x, y] of BOLTS) plate.holes.push(circle(.085, x, y));
      g.add(mesh(extrude(plate, .16, .03), MAT.alu));
      g.add(mesh(memo('exDoorBores', () => merge(BOLTS.map(([x, y]) => [linerZ(.054, -.08, .08), at(x, y, 0)]))), MAT.lining));
      g.add(mesh(rbox(OW, OH, .06, .22, .02), MAT.alu, V(0, 0, .11)));
      for (const h0 of HINGES) {
        const k = V(HX, h0 + .14, 0);
        g.add(mesh(knuckle(), MAT.alu, k), mesh(knuckleBore(), MAT.lining, k));
        g.add(mesh(memo('exDoorLug', () => rbox(.08, .26, .14, .03, .015)), MAT.alu, V(-FW / 2 + .01, h0 + .14, 0)));
      }
      return g;
    }
    const makeGasket = () => group(mesh(memo('exGasket', () => extrude(frameShape(OW + .3, OH + .3, .32, OW + .14, OH + .14, .26), .03, .008, 2)), MAT.rubber));
    const makePin = () => group(mesh(memo('exPin', () => merge([
      [new THREE.CylinderGeometry(.03, .03, .6, 32)],
      [lathe([[.001, .3], [.05, .3], [.05, .322], [.036, .334], [.001, .337]], 48)],
      [lathe([[.001, -.31], [.024, -.31], [.03, -.3]], 32)],
    ])), MAT.steel));
    const makeWasher = () => group(mesh(memo('exWasher', () => lathe([[.03, 0], [.062, 0], [.062, .012], [.03, .012], [.03, 0]], 48)), MAT.steel));
    function makeNameplate() {
      const g = new THREE.Group();
      g.add(mesh(memo('exPlate', () => rbox(1, .6, .012, .03, .004)), MAT.steel));
      // 글자 자리를 대신하는 빈 줄 (실제 표기·인증 마크는 넣지 않음)
      g.add(mesh(memo('exPlateLines', () => merge([
        [new THREE.PlaneGeometry(.16, .16), at(-.36, .15, .0062)],
        [new THREE.PlaneGeometry(.52, .025), at(.12, .2, .0062)],
        [new THREE.PlaneGeometry(.52, .025), at(.12, .1, .0062)],
        [new THREE.PlaneGeometry(.8, .02), at(0, -.04, .0062)],
        [new THREE.PlaneGeometry(.8, .02), at(0, -.12, .0062)],
        [new THREE.PlaneGeometry(.6, .02), at(-.1, -.2, .0062)],
      ])), MAT.hole));
      g.add(mesh(memo('exRivets', () => merge([[-.44, .24], [.44, .24], [-.44, -.24], [.44, -.24]].map(([x, y]) => [lathe([[.028, 0], [.022, .016], [.001, .022]], 24), TM(V(x, y, .006), toZ)]))), MAT.steel));
      return g;
    }
    const BARX = [...Array.from({ length: 8 }, (_, i) => -.7 + i * .2), -.9, .9];
    const makeBar = () => group(
      mesh(memo('exBar', () => {
        const s = rrect(2 - .012, .1 - .012, .014);
        for (const x of BARX) s.holes.push(circle(.02, x, 0));
        return extrude(s, .03, .006);
      }), MAT.steel),
      mesh(memo('exBarHoles', () => merge(BARX.map(x => [linerZ(.013, -.015, .015), at(x, 0, 0)]))), MAT.lining));
    // 받침: 윗면 가운데에 바 고정 나사가 들어가는 막힌 구멍
    const makeStandoff = () => group(
      mesh(memo('exStandoff', () => {
        const s = rrect(.136, .136, .018);
        s.holes.push(circle(.016 + .012));
        return extrude(s, .22, .012);
      }), MAT.plastic),
      mesh(memo('exStandoffHole', () => linerZ(.015, -.11, .11, true)), MAT.lining));
    function makeClamp() {
      const g = new THREE.Group();
      g.add(mesh(memo('exClamp', () => rbox(.09, .17, .08, .015, .006)), MAT.plastic));
      addHeads(g, heads('exClampHead', [.024, .012, 'slot'], [at(0, .03, .04, toZ)]));
      return g;
    }

    // 내압 케이블 글랜드 (y축 = 글랜드 축, 위가 바깥쪽, 원점 = 윗벽 바깥면): 황동 몸통(긴 나사산이 입구에 깊게 물린다) · 고무 실 · 백 너트
    const makeDGBody = () => group(mesh(memo('exGBody', () => merge([
      [threadGeo({ r: .094, depth: .007, pitch: .022, y0: -.14, y1: 0 })],
      [lathe([[.06, -.14], [.094, -.14]], 40)],
      [hexPrism(.15, .06, .07, .035, .008)],
      [threadGeo({ r: .1, depth: .007, pitch: .022, y0: .07, y1: .17 })],
      [lathe([[.1, .17], [.082, .17], [.082, .07], [.06, .07], [.06, -.14]], 40)],
    ])), MAT.brass));
    const makeDGSeal = () => group(mesh(memo('exGSeal', () => lathe([[.046, .09], [.074, .09], [.078, .095], [.078, .185], [.074, .19], [.05, .19], [.046, .185], [.046, .09]], 32)), MAT.rubber));
    const makeDGNut = () => group(mesh(memo('exGNut', () => merge([
      [hexPrism(.16, .107, .12, .17, .008)],
      [threadGeo({ r: .107, depth: .007, pitch: .022, y0: .11, y1: .21, inside: true })],
      [lathe([[.13, .23], [.13, .245], [.12, .255], [.05, .255], [.05, .215], [.107, .215]], 40)],
    ])), MAT.brass));
    // 막음 마개: 쓰지 않는 입구를 막는 육각 마개 + 머리 밑 고무 와셔
    const makeDPlug = () => group(
      mesh(memo('exPlug', () => merge([
        [threadGeo({ r: .094, depth: .007, pitch: .022, y0: -.13, y1: -.008 })],
        [lathe([[.001, -.13], [.094, -.13]], 40)],
        [hexPrism(.13, 0, .06, .03, .008)],
        [lathe([[.06, .06], [.05, .068], [.001, .07]], 32)],
      ])), MAT.brass),
      mesh(memo('exPlugWasher', () => lathe([[.1, -.008], [.125, -.008], [.125, 0], [.1, 0], [.1, -.008]], 40)), MAT.rubber));
    // 브리더 드레인: 육각 몸통 + 가운데 금속 필터(어두운 원통) + 뚜껑 (원점 = 보스 끝면, y축 = 바깥쪽)
    const makeDBreather = () => group(
      mesh(memo('exBreather', () => merge([
        [threadGeo({ r: .038, depth: .005, pitch: .014, y0: -.05, y1: 0 })],
        [hexPrism(.07, 0, .045, .0225, .006)],

  function productEp() {
    const BW = 3, BH = 4.4, BD = 1, ST = .04, CZ = .065;   // 상자 크기, 철판 두께, 커버 앞면 높이

    const ML0 = [-.85, 1.8], RL0 = [-.95, .42], IP0 = [0, -.2];     // 명판 중심
    const SCREWS = [[-1.38, 2.08], [1.38, 2.08], [-1.38, -2.08], [1.38, -2.08]];
    const RB = [45, 135, 225, 315].map(d => [Math.cos(deg(d)) * .63, Math.sin(deg(d)) * .63]);   // 레귤레이터 볼트 자리
    const PORT = .11, NEEDLE = DIAL_ANGLE(.24);

    // 레귤레이터 윤곽: 원에 볼트 귀 4개가 붙은 모양
    function lobed(r, ear, hole) {
      const s = new THREE.Shape(), N = 180;
      for (let i = 0; i < N; i++) {
        const a = i / N * Math.PI * 2, rr = r + ear * Math.pow(Math.max(0, Math.cos(4 * (a - Math.PI / 4))), 6);
        if (i) s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else s.moveTo(rr, 0);
      }
      if (hole) for (const [x, y] of RB) s.holes.push(circle(hole, x, y));
      return s;
    }
    const flat = (s, h, y, bevel = 0) => extrude(s, h, bevel, 2).rotateX(-Math.PI / 2).translate(0, y, 0);
    function vslot(cx, cy, w, h) {
      const p = new THREE.Path(), r = w / 2;
      p.absarc(cx, cy + h / 2 - r, r, 0, Math.PI, false);
      p.absarc(cx, cy - h / 2 + r, r, Math.PI, Math.PI * 2, false);
      p.closePath();
      return p;
    }
    // 압축 스프링: 양 끝 0.8바퀴는 촘촘히 붙여 감고(닫힌 끝), 가운데만 간격을 둔다
    function helix(r, wire, y0, y1, turns) {
      const L = y1 - y0, e = .8, tight = wire * 2.1, active = (L - 2 * e * tight) / (turns - 2 * e), n = Math.ceil(turns * 24), pts = [];
      for (let i = 0; i <= n; i++) {
        const u = i / n * turns, a = u * Math.PI * 2;
        const y = u < e ? u * tight : u > turns - e ? L - (turns - u) * tight : e * tight + (u - e) * active;
        pts.push(V(Math.cos(a) * r, y0 + y, Math.sin(a) * r));
      }

      spread: 1.8, far: 1.3, ...d, fieldParts: true, groups: K.groups, parts: K.parts, hover: .015, lift: .12, bob: .035, dur: 1900, stagger: 10,
      types: K.parts.map(p => ({ key: p.key, build: p.make, ko: p.ko, en: p.en })),
      spec: K.parts.map(p => ({ key: p.key, pos: V(), q: Q(), boom: V(), group: p.grp })),
      order: Object.keys(K.groups).flatMap(g => K.parts.filter(p => p.grp === g).map(p => p.key)),
    };
  }

  function productShip() {
    const L2 = 8, HB = 1.3, M = FM;
    // 갑판 높이에서의 반폭(뱃머리는 뭉툭하게 좁아지고, 선미는 살짝 좁아진다)과 배 밑바닥 높이(선수·선미에서 올라간다)
    const hb = x => x > 4.4 ? Math.max(HB * Math.pow(1 - Math.min((x - 4.4) / (L2 - 4.4), 1) ** 2.2, 1 / 2.2), .015)
      : x < -5 ? HB * (1 - .22 * ((-5 - x) / (L2 - 5)) ** 2) : HB;
    const keel = x => x > 5.8 ? DK * .6 * ((x - 5.8) / (L2 - 5.8)) ** 2.5 : x < -5.2 ? .95 * Math.sqrt(Math.min((-5.2 - x) / (L2 - 5.2), 1)) : 0;
    const shape = x => { const w = hb(x), yb = keel(x); return { w, yb, yc: Math.min(yb + .6, DK - .05), n: 2 + 4 * (w / HB) ** 2 }; };
    // 한 위치의 선체 단면: 왼쪽 갑판 끝 → 배 밑 → 오른쪽 갑판 끝 (옆면은 곧고, 아래 모서리는 둥글다)
    function sect(x) {
      const { w, yb, yc, n } = shape(x), half = [];
      for (let j = 0; j <= 6; j++) half.push([w, DK - (DK - yc) * j / 6]);
      for (let j = 1; j <= 20; j++) {
        const a = j / 20 * Math.PI / 2;
        half.push([w * Math.cos(a) ** (2 / n), yc - (yc - yb) * Math.sin(a) ** (2 / n)]);
      }
      return [...half.map(([z, y]) => [-z, y]), ...half.slice(0, -1).reverse()];
    }
    // 높이 y에서 선체 안쪽 반폭 (바닥판 크기를 맞출 때 쓴다)
    function widthAt(x, y) {
      const { w, yb, yc, n } = shape(x);
      if (y >= yc) return w;
      if (y <= yb) return 0;
      return w * Math.cos(Math.asin(((yc - y) / (yc - yb)) ** (n / 2))) ** (2 / n);
    }
    function hullSurf(x0, x1) {
      const nx = Math.max(4, Math.ceil((x1 - x0) / .1)), G = sect(0).length, pos = [], uv = [], idx = [];
      for (let i = 0; i <= nx; i++) {
        const x = x0 + (x1 - x0) * i / nx;
        for (const [z, y] of sect(x)) { pos.push(x, y, z); uv.push(i / nx, y / DK); }
      }
      for (let i = 0; i < nx; i++) for (let j = 0; j < G - 1; j++) {
        const a = i * G + j, b = a + G;
        idx.push(a, b, a + 1, b, b + 1, a + 1);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }
    // 단면을 메운 판(자른 면 · 칸막이벽 · 선미 판). dir = +1이면 +x쪽, -1이면 -x쪽을 본다.
    // 안쪽 판은 선체 면보다 살짝 안으로 들여서, 테두리가 바깥 면에 흰 줄로 비치지 않게 한다 (선미 판은 바깥 면이라 그대로)
    function cap(x, dir, inset = .03) {
      const g = new THREE.ShapeGeometry(new THREE.Shape(sect(x).map(([z, y]) => V2(Math.sign(z) * Math.max(Math.abs(z) - inset, 0), Math.min(y + inset, DK)))));
      g.rotateY(dir * Math.PI / 2).translate(x, 0, 0);
      const p = g.attributes.position, u = g.attributes.uv;
      for (let i = 0; i < p.count; i++) u.setXY(i, .5, p.getY(i) / DK);
      return g;
    }
    // 선체 안 바닥판: 높이 y에서 선체 안쪽 폭에 딱 맞춘다
    function floorAt(x0, x1, y) {
      const n = Math.max(2, Math.ceil((x1 - x0) / .2)), st = [];
      for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; st.push([x, Math.max(widthAt(x, y) - .012, .01)]); }
      const s = new THREE.Shape([...st.map(([x, w]) => V2(x, w)), ...st.slice().reverse().map(([x, w]) => V2(x, -w))]);
      return new THREE.ShapeGeometry(s).rotateX(-Math.PI / 2).translate(0, y, 0);
    }
    // 평면이 둥근 기둥(연돌 등): 바닥 모양 rrect를 위로 뽑는다
    const pillar = (w, d, r, y0, y1, x, z = 0) => extrude(rrect(w, d, r), y1 - y0, .01, 2).rotateX(-Math.PI / 2).translate(x, (y0 + y1) / 2, z);

    // 선체 토막 하나: 바깥면(색 띠) + 안쪽면(밝은 회색) + 자른 면. aft = 'hull'이면 뒤 끝이 선미 판
    const hullOf = (x0, x1, aft = 'cut') => {
      const g = hullSurf(x0, x1), out = [mesh(g, M.hull), mesh(g, M.hullIn)], ends = [];
      if (aft === 'hull') { const tr = cap(x0, -1, 0); out.push(mesh(tr, M.hull), mesh(tr, M.hullIn)); } else ends.push([cap(x0, -1)]);
      if (x1 < L2) ends.push([cap(x1, 1)]);
      if (ends.length) out.push(mesh(merge(ends), M.cut));
      return out;
    };
    const skeg = () => {
      const pts = [];
      for (let x = -7.1; x <= -5.25; x += .1) pts.push(V2(x, keel(x) + .06));
      pts.push(V2(-5.25, .12), V2(-7.1, .34));
      return extrude(new THREE.Shape(pts), .1, .02);
    };
    const K = fieldKit(), part = K.part, SP = s => s > 0 ? ['S', '오른쪽'] : ['P', '왼쪽'];

    // 묶음: 분해할 때 통째로 옮겨 가는 양 [x, y, z]와 기울기 — 선체 토막은 앞뒤로 벌어지며 속이 보이게 살짝 눕는다
    K.group('mast', [-2.5, 4.4, 0]);

    // 캣워크(오른쪽 화물관 옆 높은 통로): 거주구 1층 지붕 턱과 같은 높이에서 시작해 선수 창고 앞에서 계단으로 내려선다
    const CWz = .72, CWy = DK + .57, CWx0 = -5.22, CWx1 = 5.5;

    // ---- 레이더 마스트 ----
    part('mast', 'pole', '레이더 마스트', 'Radar Mast', [0, 0, 0], mesh(merge([

    part('funnel', 'exhaust2', '발전기 배기관', 'Generator Exhausts', [.2, 1.08, 0], mesh(merge([-.14, 0, .14].map(z => [new THREE.CylinderGeometry(.025, .025, .12, 12), at(-6.86, DK + 2.62, z)])), M.black));

      mesh(new THREE.TorusGeometry(.045, .007, 8, 24).rotateY(Math.PI / 2).translate(-5.945, DK + 1.9, 0), M.black));
    part('bridge', 'chart', '해도대', 'Chart Table', [-.15, .26, -.1],

      part('house', `win${i + 1}F`, `${i + 1}층 앞 창문`, 'Front Windows', [.42, UP[i], 0], mesh(merge(fw), M.window));

    part('pump', 'hull', '펌프룸 선체', 'Pump Room Hull', [0, 0, 0], ...hullOf(-4.6, -3.2),

        ...[-4.4, -3.4].map(x => [new THREE.BoxGeometry(.02, .12, .02), at(x, 1.8, -1.27)]),
      ]), M.steel),
      // 전선관 2줄: 트레이 밑에서 곧게 내려와 박스 윗판의 케이블 글랜드 두 개(백 너트 위)에 닿는다 (오른쪽 세 번째 입구는 막음 마개)
      mesh(merge([-3.9492, -3.8928].map(x => [pipeRun([V(x, 1.745, -1.254), V(x, 1.5605, -1.254)], .01)])), M.black),
      mesh(rbox(.16, .05, .06, .015, .005).translate(-3.35, 1.84, -1.26), M.lamp),
      mesh(new THREE.CylinderGeometry(.03, .03, .08, 12).rotateX(Math.PI / 2).translate(-4.35, 1.45, -1.25), M.gas));
    part('pump', 'floor', '펌프룸 바닥', 'Pump Room Floor', [0, .35, 0], mesh(floorAt(-4.6, -3.2, .35), M.cut));
    [-4.25, -3.55].forEach((x, i) => part('pump', `pump${i + 1}`, `화물 펌프 ${i + 1}`, `Cargo Pump ${i + 1}`, [0, 1.05, .3], mesh(merge([
      [new THREE.CylinderGeometry(.14, .16, .42, 32), at(x, .56, .5)],
      [new THREE.CylinderGeometry(.18, .18, .05, 32), at(x, .79, .5)],
      [new THREE.CylinderGeometry(.1, .12, .3, 32), at(x, .96, .5)],
    ]), M.machine)));
    part('pump', 'pipes', '펌프 배관', 'Pump Piping', [0, 1.58, .3], mesh(merge([
      ...[-4.25, -3.55].map(x => [new THREE.CylinderGeometry(.05, .05, .8, 16), at(x, 1.5, .5)]),
      [new THREE.CylinderGeometry(.05, .05, .75, 16).rotateZ(Math.PI / 2), at(-3.9, 1.5, .5)],
      [new THREE.CylinderGeometry(.05, .05, .4, 16).rotateZ(Math.PI / 2), at(-3.4, .5, .5)],
      [new THREE.CylinderGeometry(.085, .085, .03, 20).rotateZ(Math.PI / 2), at(-3.215, .5, .5)],

    part('pump', 'ladder', '펌프룸 사다리', 'Pump Room Ladder', [-.38, .5, 0], mesh(merge([

    ]), M.pipe));

    // ---- 화물 탱크 · 선수: 선체 · 바닥 · 칸막이 ----
    for (const [g, x0, x1, wall, ko, en] of [['cargoA', -3.2, 1.2, -1, '뒤', 'Aft'], ['cargoB', 1.2, 5, 3.1, '앞', 'Fwd']]) {

      part(g, 'frames', `화물 탱크 늑골 (${ko})`, `Web Frames · ${en}`, [0, .6, 0], mesh(merge((g === 'cargoA' ? [-2.6, -1.8, -.3, .5] : [1.8, 2.5, 3.7, 4.4]).flatMap(x => [-1, 1].map(s => [new THREE.BoxGeometry(.02, DK - .06 - .32, .12), at(x, (DK - .06 + .32) / 2, s * (hb(x) - .09))]))), M.cut));

      part(g, 'walls', `화물 탱크 칸막이 (${ko})`, `Tank Bulkheads · ${en}`, [0, .8, 0], mesh(merge([[new THREE.PlaneGeometry(x1 - x0, DK - .3), at((x0 + x1) / 2, (DK + .3) / 2, 0)], [cap(wall, 1)]]), M.cut));
    }
    part('bow', 'hull', '선수 선체', 'Bow Hull', [0, 0, 0], ...hullOf(5, L2));
    part('bow', 'floor', '선수 바닥', 'Bow Floor', [0, .36, 0], mesh(floorAt(5, 6.9, .9), M.cut));
    part('bow', 'bulkhead', '충돌 칸막이벽', 'Collision Bulkhead', [0, .74, 0], mesh(cap(6, 1), M.cut));
    // 닻: 선수 양옆 선체 면에 붙어 있다 (선체가 좁아지는 기울기만큼 돌려 면에 눕힌다). 자루 · 윗고리 · 아래 팔 · 갈고리 끝
    const anchorGeo = merge([
      [new THREE.BoxGeometry(.035, .3, .03)],

      const n = V((hb(7.0) - hb(7.2)) / .2, 0, s).normalize();
      return [anchorGeo, TM(V(7.1, DK - .32, s * hb(7.1)).addScaledVector(n, .018), Q(0, Math.atan2(n.x, n.z), 0))];
    })), M.black));

    return fieldDef(K, {
      key: 'ship', box: 'exd', title: '선박 현장 분해도', note: '유조선 형태로 단순화한 모델 · 배를 분해해 내압형 방폭박스가 달린 자리를 찾아가요', hint: '배를 클릭하면 분해돼요',
      asm: { p: V(), q: Q(.38, -.42, 0) },
    });
  }

  // =====================================================================
  // 해양플랜트 현장: 고정식 생산 플랫폼 (바다 밑에 박는 철골 자켓 위에 두 층 갑판)
  // (모양과 박스 위치는 예시로 단순화한 것. 좌표: x = 좌우, y = 위, z = 앞쪽)
  // =====================================================================
  function productOffshore() {
    const M = FM, D1 = .45, D2 = 1.95, DX = 3.4, DZ = 2.3, K = fieldKit(), part = K.part;   // 하부 갑판·생산 갑판 윗면 높이, 갑판 반폭
    // 배관 모듈실: 생산 갑판 앞쪽의 벽으로 둘러싼 설비실. 본질안전 박스는 이 방 안쪽 뒷벽에 달린다
    const RM = roomShell({ x0: -1.5, x1: .75, z0: .45, z1: 2.2, y0: D2, h: 1.05 }), RF = RM.cz + RM.d / 2;
    const plate = y => rbox(2 * DX, .1, 2 * DZ, .04, .01).translate(0, y - .05, 0);
    const girders = y => [
      ...[-1, 1].map(s => [new THREE.BoxGeometry(2 * DX - .1, .16, .08), at(0, y - .18, s * (DZ - .06))]),
      ...[-2.7, -.9, .9, 2.7].map(x => [new THREE.BoxGeometry(.08, .16, 2 * DZ - .1), at(x, y - .18, 0)]),
    ];
    // gaps = 계단·사다리가 붙는 자리 (그 자리의 난간을 비운다)
    const deckRails = (y, gaps) => rails(-DX + .04, DX - .04, -DZ + .04, DZ - .04, y, .22, gaps);
    const CX = [1.5, 1.9, 2.3], CZ = [-.35, .35];

    // 묶음: 층층이 위아래로 벌어지고, 위층 설비는 옆으로 비켜난다
    K.group('derrick', [2.5, 2.1, 0], [0, 0, -.05]);
    K.group('flare', [3.4, 1.5, -1.1]);
    K.group('helideck', [-3.1, 2.8, 0], [.12, 0, 0]);
    K.group('crane', [-1.5, 2.0, -.7]);
    K.group('lifeboats', [-3.1, 1.0, 2.0]);
    K.group('quarters', [-2.5, 1.2, 0]);
    K.group('compressor', [-.2, 1.6, -1.8]);
    K.group('room', [-.4, 1.0, 1.8], [.1, 0, 0]);
    K.group('drillFloor', [1.7, 1.2, 0]);
    K.group('mainDeck', [0, .25, 0], [.05, 0, 0]);
    K.group('separators', [0, -.5, 1.5]);
    K.group('cellarDeck', [0, -1.2, 0], [.05, 0, 0]);
    K.group('conductors', [2.4, -1.6, .45]);
    K.group('jacket', [0, -2.4, 0]);

    // ---- 데릭(시추탑): 격자 탑이라 한 덩어리 ----
    part('derrick', 'tower', '데릭 (시추탑)', 'Derrick', [0, 0, 0],
      mesh(merge([
        ...lattice(1.9, 0, D2 + .73, D2 + 3.5, [.6, .6], [.2, .2], 6, .016, .032),
        [rbox(.5, .14, .5, .02, .008), at(1.9, D2 + 3.57, 0)],
        [new THREE.BoxGeometry(.5, .025, .16), at(1.9, D2 + 2.6, -.25)],
      ]), M.white),
      mesh(merge([
        [rbox(.16, .22, .12, .02, .006), at(1.9, D2 + 2.3, 0)],
        [rbox(.2, .26, .16, .02, .006), at(1.9, D2 + 1.95, 0)],
        [new THREE.CylinderGeometry(.03, .03, .6, 12), at(1.9, D2 + 1.05, 0)],
      ]), M.yellow),
      mesh(merge(Array.from({ length: 10 }, (_, i) => [new THREE.CylinderGeometry(.012, .012, 1.8, 6), at(1.72 + (i % 5) * .09, D2 + 1.63, -.3 - Math.floor(i / 5) * .06)])), M.steel),
      mesh(merge([.04, -.04].map(dx => [new THREE.CylinderGeometry(.005, .005, 1.1, 5), at(1.9 + dx, D2 + 2.95, 0)])), M.black));

    // ---- 플레어 붐: 트러스 · 받침대 · 불꽃이 나오는 끝 ----
    const fa = V(2.95, D2 + .6, -1.6), fb = V(6.1, D2 + 2.1, -1.85), ftip = fb.clone().add(V(.06, .38, 0));
    part('flare', 'boom', '플레어 붐', 'Flare Boom', [0, 0, 0], mesh(merge([
      ...truss(fa, fb, .26, 8, .014),
      [new THREE.BoxGeometry(.36, .02, .36), at(fb.x - .05, fb.y - .02, fb.z)],
      ...rails(fb.x - .23, fb.x + .13, fb.z - .18, fb.z + .18, fb.y - .01, .14, [[fb.x - .23, fb.z]], .34),
    ]), M.white));
    part('flare', 'pedestal', '붐 받침대', 'Boom Pedestal', [0, -.38, 0], mesh(merge([
      [rbox(.26, .47, .3, .03, .01), at(2.95, D2 + .235, -1.6)],
      [new THREE.BoxGeometry(.4, .03, .42), at(2.95, D2 + .015, -1.6)],
    ]), M.steel));
    part('flare', 'tip', '플레어 끝 · 불꽃', 'Flare Tip', [.42, .38, 0], mesh(strut(fb, ftip, .09, 16), M.black), flame(ftip));

    // ---- 헬기 갑판: 판 · 안전망 테두리 · 가장자리 등 · 받침 틀 · 계단 · 바람자루 ----
    const hcx = -2.75, hy = D2 + 1.85, HR = 1.35, roof = D2 + 1.5, legs = [];
    for (const x of [-3.15, -2.0]) for (const z of [-.9, .9]) legs.push([strut(V(x, roof, z), V(x, hy - .09, z), .035)]);
    legs.push(...[-.9, .9].map(z => [new THREE.BoxGeometry(1.6, .05, .05), at(hcx, hy - .065, z)]));
    legs.push([new THREE.BoxGeometry(.05, .05, 2.2), at(-3.15, hy - .065, 0)], [new THREE.BoxGeometry(.05, .05, 1.9), at(-2.0, hy - .065, 0)]);
    legs.push(...[-3.75, -1.75].map(x => [new THREE.BoxGeometry(.05, .05, 1.4), at(x, hy - .065, 0)]));
    for (const z of [-.6, .6]) legs.push([strut(V(-3.3, roof - .35, z), V(-3.75, hy - .09, z), .025)]);
    part('helideck', 'deck', '헬기 갑판', 'Helideck', [0, .32, 0],
      mesh(new THREE.CircleGeometry(HR, 8, Math.PI / 8).rotateX(-Math.PI / 2).translate(hcx, hy + .04, 0), M.heli),
      mesh(merge([[new THREE.CylinderGeometry(HR, HR, .08, 8, 1, true, Math.PI / 8), at(hcx, hy, 0)], [new THREE.CircleGeometry(HR, 8, Math.PI / 8).rotateX(Math.PI / 2), at(hcx, hy - .04, 0)]]), M.steel));
    part('helideck', 'net', '안전망 테두리', 'Safety Net', [0, .54, 0], mesh(new THREE.CylinderGeometry(HR + .2, HR, .03, 8, 1, true, Math.PI / 8).translate(hcx, hy + .02, 0), M.steel));
    part('helideck', 'lights', '가장자리 등', 'Perimeter Lights', [0, .72, 0], mesh(merge(Array.from({ length: 8 }, (_, i) => { const a = Math.PI / 8 + i * Math.PI / 4; return [new THREE.BoxGeometry(.05, .03, .05), at(hcx + Math.cos(a) * (HR - .04), hy + .06, -Math.sin(a) * (HR - .04))]; })), M.green));
    part('helideck', 'frame', '헬기 갑판 받침 틀', 'Support Frame', [0, -.2, 0], mesh(merge(legs), M.steel));
    part('helideck', 'stair', '헬기 갑판 계단', 'Access Stair', [0, 0, .55], mesh(merge(stair(V(-2.55, roof, 1.84), V(-2.55, hy + .04, HR * Math.cos(Math.PI / 8) + .02), .16)), M.steel));
    part('helideck', 'windsock', '바람자루', 'Windsock', [.38, .62, .25],
      mesh(new THREE.CylinderGeometry(.01, .01, .45, 6).translate(hcx + HR * .92, hy + .26, HR * .38), M.steel),
      mesh(lathe([[.001, 0], [.045, 0], [.03, .22], [.001, .22]], 16).rotateZ(-Math.PI / 2).translate(hcx + HR * .92 + .01, hy + .45, HR * .38), M.orange));

    // ---- 갑판 크레인: 기둥 · 운전실 · 붐 · A자 틀 · 와이어와 갈고리 ----
    const bx = -1.35, bz = .1, cpv = V(-1.25, D2 + .95, bz), ctp = V(.95, D2 + 2.05, 1.25), ctop = V(bx - .08, D2 + 1.45, bz);
    part('crane', 'pedestal', '크레인 기둥', 'Crane Pedestal', [0, 0, 0], mesh(new THREE.CylinderGeometry(.13, .15, .7, 24).translate(bx, D2 + .35, bz), M.yellow));
    part('crane', 'cab', '크레인 운전실', 'Crane Cab', [0, .32, 0], mesh(rbox(.44, .3, .36, .04, .01).translate(bx, D2 + .86, bz), M.yellow), mesh(new THREE.PlaneGeometry(.2, .14).translate(bx + .05, D2 + .9, bz + .185), M.window));
    part('crane', 'boom', '크레인 붐', 'Crane Boom', [.42, .64, .32], mesh(merge(truss(cpv, ctp, .13, 7, .011)), M.yellow));
    part('crane', 'aframe', 'A자 틀', 'A-frame', [0, .78, 0], mesh(merge([-.13, .13].map(dz => [strut(V(bx - .16, D2 + 1.0, bz + dz), ctop, .016)])), M.yellow));
    part('crane', 'rigging', '와이어 · 갈고리', 'Wire · Hook', [.6, .88, .42], mesh(merge([
      [strut(ctop, ctp, .004, 4)],
      [new THREE.CylinderGeometry(.004, .004, .7, 4), at(ctp.x, ctp.y - .35, ctp.z)],
      [new THREE.TorusGeometry(.03, .008, 8, 16, Math.PI * 1.5), at(ctp.x, ctp.y - .72, ctp.z)],
    ]), M.black));

    // ---- 구명정 2척 + 받침대 ----
    const boat = lathe([[.001, -.4], [.07, -.37], [.12, -.26], [.135, -.05], [.12, .22], [.08, .34], [.001, .4]], 32).rotateZ(-Math.PI / 2), BX = [-2.95, -2.0];
    BX.forEach((x, i) => part('lifeboats', `boat${i + 1}`, `구명정 ${i + 1}`, 'Lifeboat', [i ? .3 : -.3, .32, .45],
      mesh(boat.clone().translate(x, D2 + .6, 2.55), M.orange), mesh(new THREE.BoxGeometry(.5, .06, .16).translate(x, D2 + .72, 2.55), M.white)));
    part('lifeboats', 'davits', '구명정 받침대', 'Davits', [0, .42, 0], mesh(merge(BX.flatMap(x => [-.3, .3].flatMap(dx => [
      [strut(V(x + dx, D2 + 1.25, 2.1), V(x + dx, D2 + 1.1, 2.62), .02)],
      [new THREE.CylinderGeometry(.004, .004, .4, 4), at(x + dx, D2 + .9, 2.6)],
    ]))), M.steel));

    // ---- 거주구: 층마다 몸통 · 앞 창 · 옆 창, 층 사이 띠, 바깥 복도, 출입문, 지붕 냉방기 ----
    const qx0 = -3.3, qx1 = -1.6, qz0 = -2.1, qz1 = 2.1, fh = .5, qcx = (qx0 + qx1) / 2, QUP = [0, .44, .88];
    for (let f = 0; f < 3; f++) {
      part('quarters', `deck${f + 1}`, `거주구 ${f + 1}층`, `Quarters · Deck ${f + 1}`, [0, QUP[f], 0], mesh(rbox(qx1 - qx0, fh, qz1 - qz0, .04, .012).translate(qcx, D2 + f * fh + fh / 2, 0), M.white));
      const y = D2 + f * fh + .28, fw = [], sw = [];
      for (let x = qx0 + .2; x < qx1 - .1; x += .26) fw.push([new THREE.PlaneGeometry(.14, .16), at(x, y, qz1 + .004)]);
      part('quarters', `winF${f + 1}`, `${f + 1}층 앞 창문`, 'Front Windows', [0, QUP[f], .46], mesh(merge(fw), M.window));
      if (f) {
        for (let z = qz0 + .25; z < qz1 - .15; z += .3) sw.push([new THREE.PlaneGeometry(.14, .16).rotateY(Math.PI / 2), at(qx1 + .004, y, z)]);
        part('quarters', `winS${f + 1}`, `${f + 1}층 옆 창문`, 'Side Windows', [.46, QUP[f], 0], mesh(merge(sw), M.window));

  // =====================================================================

  function productChem() {
    const M = FM, GX = 7.2, GZ = 4.7, K = fieldKit(), part = K.part;

    const RA = roomShell({ x0: -.8, x1: 1.7, z0: .6, z1: 2.2, y0: .1, h: 1.35 }), AF = RA.cz + RA.d / 2, AB = RA.cz - RA.d / 2 + .05;

    const CR = roomShell({ x0: -4.25, x1: -2.15, z0: .55, z1: 2.15, y0: .08, h: 1.2 }), CF = CR.cz + CR.d / 2, ccx = CR.cx, ccz = CR.cz;

    K.group('ground', [0, -2.6, 0]);

    // ---- 플레어 스택: 굴뚝 · 작업 발판 · 사다리 · 불꽃 끝 · 버팀줄 · 녹아웃 드럼 · 기초 ----

      rail.push(...ladder(lp, topL, V(1, 0, 0)), ...cage(lp, 1.2, topL - .05));

    const hit = hits.find(h => h.object.material !== HIT) || hits[0];
    return hit ? hit.object.userData.part : null;
  }
  function onFocused(e) {
    aim(e);
    return ray.intersectObject(focused.obj, true).some(h => h.object.material !== HIT);
  }
  // 현장에서 고르기: 맞은 덩어리(chunk)와, 그 덩어리에 달린 방폭박스를 맞췄는지(box). 설치 장소를 볼 때는 그 덩어리만 본다
  function pickField(e) {
    aim(e);
    // 현장은 부품이 많고 겹쳐 있어서, 넉넉한 판정 상자 대신 실제 모양에 닿은 것만 고른다
    const hits = ray.intersectObjects(state === 'site' ? [hostOf(site).obj] : field.objs, true);
    const hit = hits.find(h => h.object.material !== HIT);
    if (!hit) return null;
    const pt = hit.object.userData.part;
    return pt.def === field.def ? { chunk: pt, box: false } : { chunk: field.parts.find(h => h.nest && h.nest.def === pt.def), box: true };
  }

  canvas.addEventListener('pointermove', e => {
    px = e.clientX / innerWidth;
    py = e.clientY / innerHeight;
    const tip = $('tip');
    if (homeOn || trans) return;
    // 끌기: 부품 하나를 볼 때는 그 부품을 돌리고, 그 밖에는 현장·박스 전체를 돌린다 (좌우는 끝없이, 위아래는 ±66°)
    if (down) {
      if (!down.drag && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.drag = true;
      if (down.drag) {
        const dx = e.clientX - down.lx, dy = e.clientY - down.ly;
        down.lx = e.clientX;
        down.ly = e.clientY;
        if (state === 'focus') {
          spin.y += dx * .008;
          spin.x = clamp(spin.x + dy * .006, -1.3, 1.3);
        } else {
          // 좌우는 끝없이 돌아간다. 다만 설치 장소를 볼 때는 박스가 벽 뒤로 숨지 않을 만큼만
          const ly = state === 'site' ? .85 : 1e4, lx = state === 'site' ? .45 : 1.15;
          orbit.y = clamp(orbit.y + dx * .008, -ly, ly);
          orbit.x = clamp(orbit.x + dy * .006, -lx, lx);
          wrapOrbit();
          orbited = true;
        }
        canvas.style.cursor = 'grabbing';
        tip.hidden = true;
        return;
      }
    }
    if (state === 'focus') {
      canvas.style.cursor = onFocused(e) ? 'grab' : 'zoom-out';
      tip.hidden = true;
      return;
    }
    if (isField(cur)) {
      const h = pickField(e), name = h && field.def.types[h.chunk.t].ko, sk = h && siteOf(h.chunk);
      hovered = state === 'site' ? null : h && h.chunk;
      boxHover = state === 'site' && !!(h && h.box);
      const label = state === 'assembled' ? h && '클릭해서 분해하기'
        : state === 'exploded' ? h && (sk ? `${name} · ${SITES[sk].ko}` : name)
          : boxHover ? '클릭해서 가까이 보기' : h && name;
      canvas.style.cursor = (state === 'assembled' ? h : state === 'exploded' ? sk : boxHover) ? 'pointer' : 'grab';
      tip.hidden = !label;
      if (label) {
        tip.textContent = label;
        tip.style.left = e.clientX + 'px';
        tip.style.top = e.clientY + 'px';
      }
      return;
    }
    hovered = pick(e);
    canvas.style.cursor = hovered ? 'pointer' : 'grab';
    tip.hidden = !hovered;
    if (hovered) {
      tip.textContent = state === 'assembled' ? '클릭해서 분해하기' : cur.def.types[hovered.t].ko;
      tip.style.left = e.clientX + 'px';
      tip.style.top = e.clientY + 'px';
    }
  });
  canvas.addEventListener('pointerdown', e => {
    if (menuOpen()) { setMenu(false); down = null; return; }
    down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, drag: false };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', e => {
    const d = down;
    down = null;
    if (!d || d.drag || trans || homeOn) return;
    if (state === 'focus') { if (!onFocused(e)) unfocus(); return; }
    if (isField(cur)) {
      const h = pickField(e);
      if (state === 'assembled') { if (h) explode(); }
      else if (state === 'exploded') { const sk = h && siteOf(h.chunk); if (sk) goSite(sk); }
      else if (h && h.box) enterProduct();
      else if (!h) leaveSite();
      return;
    }
    const pt = pick(e);
    if (!pt) return;
    if (state === 'assembled') explode(); else focusPart(pt);
  });
  canvas.addEventListener('pointercancel', () => { down = null; });
  canvas.addEventListener('pointerleave', () => {
    if (down) return;
    px = py = .5;
    hovered = null;
    boxHover = false;
    $('tip').hidden = true;
  });
  // 휠: 마우스가 가리킨 곳을 화면 속 그 자리에 둔 채 확대·축소한다
  const fine = matchMedia('(pointer: fine)').matches;
  const shown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    if (homeOn || trans || handoff || !cam) return;
    const dy = clamp(e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1), -300, 300);   // 줄 단위(파이어폭스) 휠도 한 칸 ≈ 100px
    const r0 = zoom ? zoom.r : 1, r = clamp(r0 * Math.exp(dy * .0015), .1, 1), s = r / r0;
    if (r > .999) { zoom = null; zoomAt = performance.now(); return; }
    if (s === 1) return;
    zoomAt = performance.now();
    // 가리킨 곳 H: 커서 방향으로 처음 닿는 또렷한 면(흐린 부품·유리·그림자는 건너뜀).
    // 없으면 바라보는 점 높이의 평면, 부품 하나를 볼 때는 그 부품 앞쪽 높이의 평면 (빈 곳을 가리켜도 부품을 지나쳐 가지 않게)
    aim(e);
    const hit = ray.intersectObjects(stage.children.filter(o => o.visible), true).find(h => {
      const m = h.object.material;
      return m.visible && m.depthWrite && m.opacity > .5 && shown(h.object);
    });
    const zf = focused ? Math.min(focused.obj.getWorldPosition(V()).z + focused.r * focused.s, (cam.d + cam.z) / 2) : cam.z;
    const H = stage.worldToLocal(hit ? hit.point : ray.ray.at((cam.d - zf) / -ray.ray.direction.z, V()));
    // 카메라(바라보는 점과 거리)를 무대 좌표에서 H를 중심으로 s배 → 기울기와 상관없이 H는 화면 속 같은 자리에 머문다.
    // 기본 화면에서 벗어난 양은 (1 − r)에 비례해 묶어서, 끝까지 축소하면 기본 화면으로 돌아온다
    const g0 = camGoal(), g = zoomGoal(g0), D0 = g0.d - g0.z, room = (1 - r) * D0 * TAN * 1.3;
    zoom = {
      r,
      x: clamp(H.x + s * (g.x - H.x) - g0.x, -room * camera.aspect, room * camera.aspect),
      y: clamp(H.y + s * (g.y - H.y) - g0.y, -room, room),
      z: clamp(H.z + s * (g.z - H.z) - g0.z, -(1 - r) * D0, (1 - r) * D0),
    };
  }, { passive: false });

  addEventListener('keydown', e => {
    const el = e.target.closest ? e.target : document.body;
    if (menuOpen()) {
      if (e.key === 'Escape') { setMenu(false); $('title').focus(); }
      return;
    }
    if (el.closest('#picker') || homeOn || trans) return;
    if ((e.key === 'Enter' || e.key === ' ') && !el.closest('button')) {
      e.preventDefault();
      if (state === 'assembled') explode(); else if (state === 'site') enterProduct(); else if (!focused) step(1);
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      if (state !== 'assembled') step(e.key === 'ArrowRight' ? 1 : -1);
    } else if (e.key === 'Escape') {
      if (state === 'site') leaveSite(); else unfocus();
    }
  });
  $('act').addEventListener('click', () => (state === 'assembled' ? explode() : assemble()));
  $('back').addEventListener('click', () => (state === 'site' ? leaveSite() : unfocus()));
  $('to-ship').addEventListener('click', () => backToSite());
  // 처음으로: 지나온 길을 거꾸로 되짚어 메인 화면까지
  $('to-start').addEventListener('click', goHome);
  // 메인 화면의 세 칸: 마우스를 올리면 그 현장이 살짝 다가오며 기울고, 누르면 그 현장으로 들어간다
  homeEl.addEventListener('pointermove', e => { px = e.clientX / innerWidth; py = e.clientY / innerHeight; });
  homeEl.querySelectorAll('.panel').forEach((b, i) => {
    let skip = false;
    b.addEventListener('pointerdown', () => { skip = menuOpen(); });   // 메뉴를 닫으려고 누른 것이면 들어가지 않는다
    b.addEventListener('pointerenter', () => { homeHover = i; });
    b.addEventListener('pointerleave', () => { if (homeHover === i) homeHover = -1; });
    b.addEventListener('focus', () => { homeHover = i; });
    b.addEventListener('blur', () => { if (homeHover === i) homeHover = -1; });
    b.addEventListener('click', () => { if (skip) { skip = false; return; } enterFromMain(i); });
  });
  $('choice').addEventListener('click', () => goSite($('choice').dataset.site));
  $('choice').addEventListener('pointerenter', () => { if (isField(cur) && state === 'exploded') hovered = hostOf(cur.def.box); });
  $('choice').addEventListener('pointerleave', () => { hovered = null; });
  document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => step(+b.dataset.step)));
  $('title').addEventListener('click', () => setMenu(!menuOpen()));
  document.addEventListener('pointerdown', e => { if (menuOpen() && !picker.contains(e.target)) setMenu(false); });
  document.querySelectorAll('[data-product]').forEach(b => b.addEventListener('click', () => { setMenu(false); select(b.dataset.product); }));
  addEventListener('hashchange', () => select(fromHash()));

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    zoom = null;
    const m = camera.aspect < .85 ? 'tall' : 'wide';
    if (m !== mode) {
      mode = m;
      if (cur && state !== 'assembled') cur.parts.forEach(pt => pt !== focused && tween(pt, C(pt), { dur: 700 }));
    }
    if (cur && focused) tween(focused, focusPose(focused), { dur: 400 });
    measureHead();
  }
  addEventListener('resize', resize);

  mode = innerWidth / innerHeight < .85 ? 'tall' : 'wide';
  resize();
  select(fromHash());
  requestAnimationFrame(frame);
})();
</script>
