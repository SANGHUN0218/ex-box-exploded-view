<meta charset="utf-8">
<title>선박 현장 분해도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<!-- 글꼴(IBM Plex)은 아래 loader 스크립트가 부른다: 여기 두면 글꼴 파일 목록을 받을 때까지 화면을 아예 안 그려 첫 화면이 하얗게 기다린다 -->
<style>
:root {
  --ink: #16171A;
  --muted: #66655F;
  --glass: rgb(255 255 255 / .74);
  --edge: rgb(22 23 26 / .1);
  --accent: #F2B300;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 42%, #F9F8F4 0%, #E7E5DF 60%, #D6D3CB 100%);
  color: var(--ink);
  font: 400 15px/1.6 var(--sans);
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#view:focus-visible { box-shadow: inset 0 0 0 3px var(--ink); }

.head {
  position: fixed;
  top: calc(22px + env(safe-area-inset-top, 0px));
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  pointer-events: none;
}
.head > * { pointer-events: auto; }
.eyebrow {
  margin: 0 0 8px;
  font: 500 11px/1 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
/* 제목을 누르면 박스 목록이 위에서 아래로 펼쳐지는 메뉴 */
.picker { position: relative; }
.title {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  border: 0;
  background: none;
  font-size: clamp(22px, 2.6vw, 32px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.02em;
  text-align: left;
  cursor: pointer;
}
.chev {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: var(--glass);
  transition: transform .4s cubic-bezier(.2, .8, .2, 1), background .2s;
}
.chev svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.title:hover .chev { background: #fff; }
.picker.open .chev { transform: rotate(180deg); }
.menu {
  position: absolute;
  top: calc(100% + 12px);
  left: 0;
  z-index: 5;
  width: max-content;
  min-width: 100%;
  max-width: calc(100vw - 36px);
  margin: 0;
  padding: 6px;
  list-style: none;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: rgb(255 255 255 / .9);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: 0 18px 40px rgb(22 23 26 / .14);
  clip-path: inset(0 0 100% 0 round 14px);
  visibility: hidden;
  transition: clip-path .26s cubic-bezier(.4, 0, .2, 1), visibility 0s linear .26s;
}
.picker.open .menu {
  clip-path: inset(0 0 0 0 round 14px);
  visibility: visible;
  transition: clip-path .5s cubic-bezier(.2, .8, .2, 1), visibility 0s;
}
.menu li { opacity: 0; transform: translateY(-12px); transition: opacity .15s, transform .15s; }
.picker.open .menu li {
  opacity: 1;
  transform: none;
  transition: opacity .35s ease calc(.08s + var(--i) * .07s), transform .5s cubic-bezier(.2, .8, .2, 1) calc(.08s + var(--i) * .07s);
}
.opt {
  appearance: none;
  display: grid;
  gap: 3px;
  width: 100%;
  padding: 11px 16px 11px 14px;
  border: 0;
  border-radius: 10px;
  background: none;
  text-align: left;
  cursor: pointer;
  transition: background .15s;
}
.opt:hover { background: rgb(22 23 26 / .05); }
.menu-gap { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--edge); }
.opt[aria-current="page"] { background: rgb(242 179 0 / .14); box-shadow: inset 3px 0 0 var(--accent); }
.opt-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
.opt-meta { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sub { margin: 8px 0 0; font-size: 13px; color: var(--muted); transition: opacity .25s; }
.picker.open + .sub { opacity: 0; }
.act {
  appearance: none;
  flex: none;
  padding: 12px 18px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 8px 20px rgb(22 23 26 / .2);
}
.act:hover { background: #2B2D32; }

.hint {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  margin: 0;
  padding: 10px 16px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  pointer-events: none;
}
body.focus .hint { display: none; }

.info {
  position: fixed;
  left: 28px;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100% - 56px));
  padding: 20px 22px;
  border: 1px solid var(--edge);
  border-radius: 16px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: 0 16px 40px rgb(22 23 26 / .12);
}
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.badge {
  display: grid;
  place-items: center;
  flex: none;
  width: 30px;
  height: 30px;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  background: var(--accent);
  font: 600 12px/1 var(--mono);
}
.count { font-size: 12px; font-weight: 600; color: var(--muted); }
.info h2 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
.en { margin: 2px 0 0; font: 500 11px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.desc { margin: 12px 0 0; }
.how { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
.nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn {
  appearance: none;
  padding: 9px 13px;
  border: 1px solid var(--edge);
  border-radius: 9px;
  background: rgb(255 255 255 / .85);
  font-weight: 600;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.btn:hover { border-color: var(--ink); }
.btn.back { margin-left: auto; }

.tip {
  position: fixed;
  left: 0;
  top: 0;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  pointer-events: none;
  transform: translate(-50%, calc(-100% - 14px));
}
.fail { position: fixed; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: var(--muted); }

/* 메인 화면: 현장 세 곳을 왼쪽·가운데·오른쪽 칸으로 (세로 화면에서는 위·가운데·아래). 3D는 뒤 캔버스에 칸별로 그린다 */
.home {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  visibility: hidden;
  opacity: 0;
  transition: opacity .2s, visibility 0s linear .2s;
}
body.mainview .home { visibility: visible; opacity: 1; transition: opacity .5s ease .1s, visibility 0s; }
.panel {
  appearance: none;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-start;
  gap: 5px;
  min-width: 0;
  padding: 0 28px calc(36px + env(safe-area-inset-bottom, 0px));
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: background .3s;
}
.panel + .panel { border-left: 1px solid var(--edge); }
.panel:hover, .panel:focus-visible { background: rgb(255 255 255 / .18); }
.panel:focus-visible { outline: 2px solid var(--ink); outline-offset: -6px; }
.p-no { font: 500 11px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
.p-name { font-size: clamp(18px, 1.7vw, 24px); font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.p-box { font-size: 13px; color: var(--muted); }
.p-go {
  margin-top: 10px;
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1;
  transition: transform .25s cubic-bezier(.2, .8, .2, 1);
}
.panel:hover .p-go, .panel:focus-visible .p-go { transform: translateX(5px); }
body.mainview .hint, body.mainview .actions > :not(.snd) { display: none; }
@media (max-aspect-ratio: 85/100) {
  .home { top: var(--home-top, 110px); grid-template-columns: 1fr; grid-template-rows: repeat(3, 1fr); }
  .panel { justify-content: center; gap: 3px; padding: 0 18px; }
  .panel + .panel { border-left: 0; border-top: 1px solid var(--edge); }
  .p-go { margin-top: 6px; padding: 7px 11px; }
}

/* 오른쪽 위 버튼 묶음: [처음으로] [← ○○ 현장으로] [분해하기/다시 조립] */
.actions { flex: none; display: flex; align-items: center; gap: 8px; }
.crumb {
  appearance: none;
  padding: 11px 16px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
}
.crumb:hover { border-color: var(--ink); background: #fff; }
/* 소리 켜기·끄기: 스피커 아이콘 (끄면 물결 대신 X) */
.crumb.snd { display: grid; place-items: center; width: 38px; height: 38px; padding: 0; }
.snd svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.snd .x, .snd.off .w { display: none; }
.snd.off .x { display: inline; }
.snd.off { color: var(--muted); }

/* 배가 분해되면 아래에서 올라오는 설치 장소 선택지 세 개 */
.choices {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: grid;
  justify-items: center;
  gap: 10px;
  width: max-content;
  max-width: calc(100% - 24px);
  visibility: hidden;
  pointer-events: none;
  transition: visibility 0s linear .3s;
}
.choices-label { margin: 0; font-size: 12.5px; font-weight: 600; line-height: 1; color: var(--muted); opacity: 0; transition: opacity .2s; }
.choice-row { display: flex; gap: 10px; }
.choice {
  appearance: none;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 212px;
  padding: 12px 18px 12px 12px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: rgb(255 255 255 / .84);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: 0 12px 30px rgb(22 23 26 / .12);
  text-align: left;
  cursor: pointer;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity .2s, transform .2s, border-color .15s;
}
.choice:hover { border-color: var(--ink); }
.choice .badge { width: 28px; height: 28px; }
.c-name { display: block; font-size: 15px; font-weight: 700; line-height: 1.3; }
.c-place { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
body.field.exploded .choices { visibility: visible; pointer-events: auto; transition: visibility 0s; }
body.field.exploded .choices-label { opacity: 1; transition: opacity .4s ease .5s; }
body.field.exploded .choice {
  opacity: 1;
  transform: none;
  transition: opacity .4s ease calc(.55s + var(--i) * .1s), transform .6s cubic-bezier(.2, .8, .2, 1) calc(.55s + var(--i) * .1s), border-color .15s;
}
body.field.exploded .hint, body.site .hint { display: none; }

/* 분해된 배 위에 박스 자리를 알려 주는 번호 핀 */
.pins { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s; }
body.field.exploded .pins { opacity: 1; transition: opacity .5s ease .9s; }
.pin {
  position: absolute;
  left: 0;
  top: 0;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  font: 600 12px/1 var(--mono);
  box-shadow: 0 0 0 3px rgb(255 255 255 / .75);
  transform: translate(-50%, calc(-100% - 14px));
}
.pin::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 14px; background: var(--ink); transform: translateX(-50%); }

@media (max-width: 640px) {
  .head { top: calc(16px + env(safe-area-inset-top, 0px)); left: 18px; right: 18px; }
  .title { font-size: 20px; gap: 8px; }
  .chev { width: 24px; height: 24px; }
  .sub { font-size: 12px; }
  .act { padding: 10px 14px; font-size: 13px; }
  /* 휴대폰에서는 두 버튼을 오른쪽 위에 세로로 쌓는다 (분해하기가 위) */
  .actions { flex-direction: column-reverse; align-items: flex-end; }
  .crumb { padding: 9px 13px; font-size: 13px; }
  .crumb.snd { width: 34px; height: 34px; padding: 0; }
  .info { left: 12px; right: 12px; width: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 16px 18px; }
  .info h2 { font-size: 20px; }
  .desc { font-size: 14px; }
  .choices { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .choice-row { flex-direction: column; gap: 8px; }
  .choice { min-width: 0; width: calc(100vw - 24px); padding: 10px 14px 10px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .menu, .menu li, .picker.open .menu, .picker.open .menu li, .chev, .choice, .choices-label, .pins, .home, .panel, .p-go { transition: none !important; }
}

/* 첫 로딩창: 불러오는 동안 로고가 조립되며 뒤를 가려 준다. 다 불러오고 로고도 마저 조립되면(JS의 loader) .hide → 잠깐(.25초) 보여 준 뒤 부드럽게 사라진다 */
.loading {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  background: radial-gradient(ellipse at 50% 42%, #F9F8F4 0%, #E7E5DF 60%, #D6D3CB 100%);
}
.loading.hide { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease .25s, visibility 0s linear .7s; }
/* 로고 조립 (사용자가 그린 프레임 순서, 칸마다 이지이지):
   ① 허공 → ② 점이 나타남 → ③ 오른쪽으로 반절 늘어남 → ④ 끝까지 늘어남 → ⑤ 선 왼쪽 끝 밑에 작은 점이 나타남 → ⑥ 그 점이 오른쪽으로 늘어나 최종 로고.
   3열 × 4줄. 줄 = 윗선(두께 W/12, 끝까지) + 밑단(두께 W/24, 왼쪽부터 칸마다 정해진 길이 --p). 크기 비율은 최종 로고 그림(열 폭 206 : 열 사이 17 : 윗선 16 : 밑단 8 : 줄 사이 9)을 따른다.
   열은 60ms, 줄은 35ms씩 살짝 늦게 시작해 물결처럼 이어진다.
   조각은 처음부터 다 자란 크기로 두고 transform(늘이기 scale)만 움직인다: 그래야 3D 장면을 짓느라 브라우저가 바쁜 동안에도 로고가 멈추지 않는다 */
.brand-mark { --W: 48px; display: flex; gap: calc(var(--W) / 12); }
.brand-mark .col { display: flex; flex-direction: column; gap: calc(var(--W) / 24); }
.brand-mark .cell { position: relative; width: var(--W); height: calc(var(--W) / 8); }
.brand-mark .cell::before,
.brand-mark .cell::after { content: ''; position: absolute; left: 0; background: var(--ink); transform-origin: 0 50%; animation: 2.1s cubic-bezier(.66, 0, .34, 1) calc(var(--c, 0) * 60ms + var(--r, 0) * 35ms) both; }
.brand-mark .cell::before { top: 0; width: var(--W); height: calc(var(--W) / 12); animation-name: mark-bar; }
/* 밑단은 윗선과 1px 겹쳐 두 조각 사이에 실금이 비치지 않게 */
.brand-mark .cell::after { top: calc(var(--W) / 12 - 1px); width: calc(var(--W) * var(--p, .5)); height: calc(var(--W) / 24 + 1px); animation-name: mark-notch; }
.brand-mark .col:nth-child(2) { --c: 1; }
.brand-mark .col:nth-child(3) { --c: 2; }
.brand-mark .cell:nth-child(2) { --r: 1; }
.brand-mark .cell:nth-child(3) { --r: 2; }
.brand-mark .cell:nth-child(4) { --r: 3; }
/* 점은 제 가운데(윗선 W/24, 밑단 W/48)에서 톡 나타나고, 그다음 왼쪽 끝을 붙든 채 오른쪽으로 늘어난다. 윗선 점 = W/12 폭, 밑단 점 = W/24 폭 */
@keyframes mark-bar {
  0%, 8% { transform: translateX(calc(var(--W) / 24)) scale(0); }
  18%, 24% { transform: translateX(0) scale(calc(1 / 12), 1); }
  42%, 47% { transform: translateX(0) scale(.5, 1); }
  65%, 100% { transform: translateX(0) scale(1); }
}
@keyframes mark-notch {
  0%, 68% { transform: translateX(calc(var(--W) / 48)) scale(0); }
  76%, 80% { transform: translateX(0) scale(calc(1 / 24 / var(--p, .5)), 1); }
  100% { transform: translateX(0) scale(1); }
}
/* 불러오기가 2.4초를 넘기면 글자가 천천히 숨 쉬듯 깜빡인다 */
.loading p { margin: 0; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); animation: load-pulse 1.2s ease-in-out 2.4s infinite alternate both; }
@keyframes load-pulse { to { opacity: .35; } }
@media (max-width: 480px) { .brand-mark { --W: 36px; } }
@media (prefers-reduced-motion: reduce) {
  .brand-mark .cell::before, .brand-mark .cell::after, .loading p { animation: none; }
  .loading.hide { transition: none; }
}
</style>

<canvas id="view" tabindex="0" aria-label="방폭박스 3D 뷰어. Enter 키로 분해하고, 좌우 화살표로 부품을 넘기고, Esc로 돌아갑니다."></canvas>

<div class="loading" id="loading" role="status" aria-live="polite">
  <!-- --p = 밑단 길이(열 폭에 대한 비율), 최종 로고 그림에서 잰 값 -->
  <div class="brand-mark" aria-hidden="true">
    <div class="col"><span class="cell" style="--p:.8"></span><span class="cell" style="--p:.8"></span><span class="cell" style="--p:.16"></span><span class="cell" style="--p:.16"></span></div>
    <div class="col"><span class="cell" style="--p:.8"></span><span class="cell" style="--p:.32"></span><span class="cell" style="--p:.64"></span><span class="cell" style="--p:.16"></span></div>
    <div class="col"><span class="cell" style="--p:.32"></span><span class="cell" style="--p:.48"></span><span class="cell" style="--p:.64"></span><span class="cell" style="--p:.8"></span></div>
  </div>
  <p>불러오는 중…</p>
</div>
<script>
// 로딩창 로고를 실제 불러오기에 맞춘다 (three.js도 여기서 부른다)
// · 불러오는 동안: 처음엔 원래와 비슷한 속도로 조립되다가 점점 느려진다 — 11초 곡선, 1 - e^(-t/2.4초)에 맞춤 (1.5초에 반, 5초에 88%)
// · 다 불러오면 finish(): 남은 조립을 원래 빠르기의 1.4배로 마저 하고 로딩창을 걷는다 → 빨리 불러오면 로고도 빨리, 오래 걸리면 천천히
// · 글꼴도 여기서 부른다(스크립트가 붙인 글꼴은 화면 그리기를 막지 않음 → 로딩창이 곧바로 보임. 그동안 글자는 비슷한 시스템 글꼴로 나왔다가 바뀜)
// · claude.ai 안(iframe)에서는 페이지 load 뒤에 글꼴·three.js를 부르고 로고도 그때 시작한다: 바깥 화면의 동그라미 로딩은 이 페이지의 load 무렵 걷히는 것으로
//   보여서(추정), 가벼운 페이지로 load를 먼저 끝내야 동그라미가 금방 걷히고 이 로고가 실제 불러오기(3D 장면 짓기·첫 그리기)를 보여 준다
const loader = (() => {
  const box = document.getElementById('loading');
  const marks = box.getAnimations ? box.getAnimations({ subtree: true }).filter(a => /^mark-/.test(a.animationName)) : [];
  const base = marks.length && marks[0].effect.getTiming().duration;
  marks.forEach(a => a.effect.updateTiming({ duration: 11000, easing: 'cubic-bezier(.19, .88, .46, .98)' }));
  const three = document.createElement('script');
  const fonts = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap' });
  let boot, got = false, started = false;
  // 본 스크립트(3D 장면 짓기 · 첫 그리기)는 무거워서 도는 동안 페이지가 멈춘다. 로고가 먼저 화면에 올라가 브라우저가 따로 돌리기 시작한 뒤(두 프레임 뒤)에 돌려야
  // 그동안에도 로고가 계속 움직인다 — 바로 돌리면 로고가 한 번도 안 그려진 채 멈춰 있다가 거의 다 된 모습으로 나타난다
  const go = () => { if (got && boot) requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(boot))); };
  three.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  three.onload = three.onerror = () => { got = true; go(); };
  const start = () => {
    if (started) return;
    started = true;
    marks.forEach(a => a.play());
    document.head.append(fonts, three);
  };
  if (top === self) start();
  else { marks.forEach(a => a.pause()); addEventListener('load', start); setTimeout(start, 3000); }   // 3초: load가 늦게 오는 망에서도 멈춰 있지 않게
  return {
    run: fn => { boot = fn; go(); },   // three.js를 받은 뒤 fn(본 스크립트)을 돌린다
    finish: () => {
      marks.forEach(a => {
        const { progress } = a.effect.getComputedTiming(), { delay } = a.effect.getTiming(), t = a.currentTime;
        a.effect.updateTiming({ duration: base, easing: 'linear' });
        if (t > delay) a.currentTime = delay + progress * base;   // 지금 모양 그대로 이어서
        a.playbackRate = 1.4;
      });
      return Promise.race([
        Promise.all(marks.map(a => a.finished)).catch(() => {}),
        new Promise(res => setTimeout(res, 2500)),   // 안전장치: 애니메이션이 어떤 이유로 안 끝나도 로딩창에 갇히지 않게
      ]);
    },
  };
})();
</script>

  if (!window.THREE) return fail();
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: $('view'), antialias: true, alpha: true });
  } catch (err) {
    return fail();
  }
  const canvas = renderer.domElement;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;

      c.moveTo(X0, -oy);
      c.lineTo(ox - R, -oy); c.quadraticCurveTo(ox, -oy, ox, -oy + R);
      c.lineTo(ox, oy - R); c.quadraticCurveTo(ox, oy, ox - R, oy);
      c.lineTo(-ox + R, oy); c.quadraticCurveTo(-ox, oy, -ox, oy - R);
      c.lineTo(-ox, -oy + R); c.quadraticCurveTo(-ox, -oy, -ox + R, -oy);
      c.lineTo(-X0, -oy); c.lineTo(-X0, -iy);
      c.lineTo(-ix + r, -iy); c.quadraticCurveTo(-ix, -iy, -ix, -iy + r);
      c.lineTo(-ix, iy - r); c.quadraticCurveTo(-ix, iy, -ix + r, iy);
      c.lineTo(ix - r, iy); c.quadraticCurveTo(ix, iy, ix, iy - r);
      c.lineTo(ix, -iy + r); c.quadraticCurveTo(ix, -iy, ix - r, -iy);

      const fz = D / 2 - .03, floor = new THREE.Shape([V2(-X0, -fz), V2(X0, -fz), V2(X0, fz), V2(-X0, fz)]);

        [pinX(extrude(c, D, .03, 4), (x, y) => y < -1.3 && Math.abs(x) < X0 ? Math.sign(x) * X0 : x)],

  function productExd() {
    const EW = 2.8, EH = 3.6, ED = 1.5, ET = .12;   // 뒤쪽 몸통 바깥 크기, 깊이, 뒤판 두께

    const RBZ = -FT - ED / 2, X0 = .9, TOPZ = -.46, TOPX = [-.55, 0, .55], TR = .1, EYEX = 1.05, EARTH = [-1.2, RBZ], BRX = .6;
    const OX = (EW - .06) / 2, OY = (EH - .06) / 2, IX = (OW + .06) / 2, IY = (OH + .06) / 2;
    const OXo = OX + .03, OYo = OY + .03, IYi = IY - .03;   // 둥글림(.03)까지 더한 실제 바깥면·안쪽면 (벽 두께 .2)
    const shellGeo = () => memo('exShell', () => {

    function makeBody() {

  function productEp() {

        if (i) s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else s.moveTo(rr, 0);

      if (hole) for (const [x, y] of RB) s.holes.push(circle(hole, x, y));
      return s;

      const p = new THREE.Path(), r = w / 2;
      p.absarc(cx, cy + h / 2 - r, r, 0, Math.PI, false);
      p.absarc(cx, cy - h / 2 + r, r, Math.PI, Math.PI * 2, false);

    // 압축 스프링: 양 끝 0.8바퀴는 촘촘히 붙여 감고(닫힌 끝), 가운데만 간격을 둔다
    function helix(r, wire, y0, y1, turns) {
      const L = y1 - y0, e = .8, tight = wire * 2.1, active = (L - 2 * e * tight) / (turns - 2 * e), n = Math.ceil(turns * 24), pts = [];

        pts.push(V(Math.cos(a) * r, y0 + y, Math.sin(a) * r));

      const ball = new THREE.SphereGeometry(wire * 1.04, 16, 12);

  // 탱크 둘레를 감아 오르는 계단: 바닥 중심 c, 탱크 반지름 r, 높이 h, 각도 a0부터 span만큼 돈다
  function spiralStair(c, r, h, a0, span, w = .14) {

  // 벽으로 둘러싼 방 (앞벽은 +z 쪽). 바닥·뒷벽·옆벽 / 문과 창이 뚫린 앞벽 / 지붕을 따로 만들어 분해할 때 따로 떨어지게 한다
  function roomShell({ x0, x1, z0, z1, y0, h, t = .05 }) {
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, w = x1 - x0, d = z1 - z0;
    return {
      cx, cz, w, d,
      floor: new THREE.BoxGeometry(w - .02, .04, d - .02).translate(cx, y0 + .02, cz),
      // 벽을 한 장씩 따로 떼어 쓸 때: 뒷벽(back) + 그 안쪽 면(backIn, 밝은 색 얇은 판), 옆벽(side(−1 = 왼쪽, 1 = 오른쪽)) + 안쪽 면(sideIn)
      back: new THREE.BoxGeometry(w, h, t).translate(cx, y0 + h / 2, z0 + t / 2),
      backIn: pane(w - 2 * t, h - .02, .002).translate(cx, y0 + h / 2, z0 + t + .002),
      side: s => new THREE.BoxGeometry(t, h, d - t).translate(s < 0 ? x0 + t / 2 : x1 - t / 2, y0 + h / 2, cz + t / 2),
      sideIn: s => pane(d - t, h - .02, .002).rotateY(s < 0 ? Math.PI / 2 : -Math.PI / 2).translate(s < 0 ? x0 + t + .002 : x1 - t - .002, y0 + h / 2, cz + t / 2),
      // holes: [[가로 가운데(방 가운데 기준), 아래 높이, 폭, 높이]]
      front(holes) {
        const s = new THREE.Shape([V2(-w / 2, 0), V2(w / 2, 0), V2(w / 2, h), V2(-w / 2, h)]);
        for (const [hx, hy, hw, hh] of holes) s.holes.push(new THREE.Path([V2(hx - hw / 2, hy), V2(hx - hw / 2, hy + hh), V2(hx + hw / 2, hy + hh), V2(hx + hw / 2, hy)]));
        return extrude(s, t).translate(cx, y0, z0 + d - t / 2);
      },
      roof: merge([
        [rbox(w + .12, .07, d + .12, .02, .006), at(cx, y0 + h + .035, cz)],
        ...[-1, 1].map(s => [new THREE.BoxGeometry(w + .12, .06, .03), at(cx, y0 + h + .1, cz + s * (d / 2 + .045))]),

  // ---------- 현장 부품 목록 ----------
  // 현장은 '묶음'(건물·설비 하나)과 그 안의 부품으로 나눈다. 분해하면 부품들이 먼저 묶음 안에서 따로 벌어지고(ex = 더 움직이는 양 [x, y, z]),
  // 이어서 묶음째 멀리 옮겨 간다(drift · tilt). 울타리·시추탑·자켓 같은 격자 구조물은 한 덩어리로 둔다
  function fieldKit() {
    const parts = [], groups = {};
    return {
      parts, groups,
      group: (name, drift, tilt = [0, 0, 0]) => { groups[name] = { drift, tilt }; },
      part: (grp, key, ko, en, ex, ...objs) => { parts.push({ grp, key: `${grp}/${key}`, ko, en, ex, make: () => group(...objs.flat()) }); },

      spec: K.parts.map(p => ({ key: p.key, pos: V(), q: Q(), boom: V(), group: p.grp })),
      order: Object.keys(K.groups).flatMap(g => K.parts.filter(p => p.grp === g).map(p => p.key)),
    };
  }

  function productShip() {
    const L2 = 8, HB = 1.3, M = FM;
    // 갑판 높이에서의 반폭(뱃머리는 뭉툭하게 좁아지고, 선미는 살짝 좁아진다)과 배 밑바닥 높이(선수·선미에서 올라간다)
    const hb = x => x > 4.4 ? Math.max(HB * Math.pow(1 - Math.min((x - 4.4) / (L2 - 4.4), 1) ** 2.2, 1 / 2.2), .015)
      : x < -5 ? HB * (1 - .22 * ((-5 - x) / (L2 - 5)) ** 2) : HB;
    const keel = x => x > 5.8 ? DK * .6 * ((x - 5.8) / (L2 - 5.8)) ** 2.5 : x < -5.2 ? .95 * Math.sqrt(Math.min((-5.2 - x) / (L2 - 5.2), 1)) : 0;
    const shape = x => { const w = hb(x), yb = keel(x); return { w, yb, yc: Math.min(yb + .6, DK - .05), n: 2 + 4 * (w / HB) ** 2 }; };
    // 한 위치의 선체 단면: 왼쪽 갑판 끝 → 배 밑 → 오른쪽 갑판 끝 (옆면은 곧고, 아래 모서리는 둥글다)
    function sect(x) {
      const { w, yb, yc, n } = shape(x), half = [];
      for (let j = 0; j <= 6; j++) half.push([w, DK - (DK - yc) * j / 6]);
      for (let j = 1; j <= 20; j++) {
        const a = j / 20 * Math.PI / 2;
        half.push([w * Math.cos(a) ** (2 / n), yc - (yc - yb) * Math.sin(a) ** (2 / n)]);
      }
      return [...half.map(([z, y]) => [-z, y]), ...half.slice(0, -1).reverse()];
    }
    // 높이 y에서 선체 안쪽 반폭 (바닥판 크기를 맞출 때 쓴다)
    function widthAt(x, y) {
      const { w, yb, yc, n } = shape(x);
      if (y >= yc) return w;
      if (y <= yb) return 0;
      return w * Math.cos(Math.asin(((yc - y) / (yc - yb)) ** (n / 2))) ** (2 / n);
    }

      for (let i = 0; i <= nx; i++) {
        const x = x0 + (x1 - x0) * i / nx;
        for (const [z, y] of sect(x)) { pos.push(x, y, z); uv.push(i / nx, y / DK); }
      }
      for (let i = 0; i < nx; i++) for (let j = 0; j < G - 1; j++) {

        idx.push(a, b, a + 1, b, b + 1, a + 1);

      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idx);
      g.computeVertexNormals();

    // 안쪽 판은 선체 면보다 살짝 안으로 들여서, 테두리가 바깥 면에 흰 줄로 비치지 않게 한다 (선미 판은 바깥 면이라 그대로)

  // =====================================================================
  // 해양플랜트 현장: 고정식 생산 플랫폼 (바다 밑에 박는 철골 자켓 위에 두 층 갑판)
  // (모양과 박스 위치는 예시로 단순화한 것. 좌표: x = 좌우, y = 위, z = 앞쪽)
  // =====================================================================
  function productOffshore() {
    const M = FM, D1 = .45, D2 = 1.95, DX = 3.4, DZ = 2.3, K = fieldKit(), part = K.part;   // 하부 갑판·생산 갑판 윗면 높이, 갑판 반폭

    const girders = y => [
      ...[-1, 1].map(s => [new THREE.BoxGeometry(2 * DX - .1, .16, .08), at(0, y - .18, s * (DZ - .06))]),
      ...[-2.7, -.9, .9, 2.7].map(x => [new THREE.BoxGeometry(.08, .16, 2 * DZ - .1), at(x, y - .18, 0)]),
    ];
    // gaps = 계단·사다리가 붙는 자리 (그 자리의 난간을 비운다)
    const deckRails = (y, gaps) => rails(-DX + .04, DX - .04, -DZ + .04, DZ - .04, y, .22, gaps);
    const CX = [1.5, 1.9, 2.3], CZ = [-.35, .35];

    // 묶음: 층층이 위아래로 벌어지고, 위층 설비는 옆으로 비켜난다
    K.group('derrick', [2.5, 2.1, 0], [0, 0, -.05]);
    K.group('flare', [3.4, 1.5, -1.1]);
    K.group('helideck', [-3.1, 2.8, 0], [.12, 0, 0]);
    K.group('crane', [-1.5, 2.0, -.7]);
    K.group('lifeboats', [-3.1, 1.0, 2.0]);
    K.group('quarters', [-2.5, 1.2, 0]);
    K.group('compressor', [-.2, 1.6, -1.8]);
    K.group('room', [-.4, 1.0, 1.8], [.1, 0, 0]);
    K.group('drillFloor', [1.7, 1.2, 0]);
    K.group('mainDeck', [0, .25, 0], [.05, 0, 0]);
    K.group('separators', [0, -.5, 1.5]);
    K.group('cellarDeck', [0, -1.2, 0], [.05, 0, 0]);
    K.group('conductors', [2.4, -1.6, .45]);
    K.group('jacket', [0, -2.4, 0]);

    // ---- 데릭(시추탑): 격자 탑이라 한 덩어리 ----
    part('derrick', 'tower', '데릭 (시추탑)', 'Derrick', [0, 0, 0],
      mesh(merge([
        ...lattice(1.9, 0, D2 + .73, D2 + 3.5, [.6, .6], [.2, .2], 6, .016, .032),
        [rbox(.5, .14, .5, .02, .008), at(1.9, D2 + 3.57, 0)],
        [new THREE.BoxGeometry(.5, .025, .16), at(1.9, D2 + 2.6, -.25)],
      ]), M.white),
      mesh(merge([
        [rbox(.16, .22, .12, .02, .006), at(1.9, D2 + 2.3, 0)],
        [rbox(.2, .26, .16, .02, .006), at(1.9, D2 + 1.95, 0)],
        [new THREE.CylinderGeometry(.03, .03, .6, 12), at(1.9, D2 + 1.05, 0)],
      ]), M.yellow),

  function productChem() {
    const M = FM, GX = 7.2, GZ = 4.7, K = fieldKit(), part = K.part;
    // 분석기실: 공정 가스를 분석하는 장비를 모아 둔 건물. 양압형 박스는 이 방 안쪽 뒷벽에 달린다

    const TANKS = [[-5.3, -2.9], [-3.1, -2.9]], TR = .95, TH = 1.5;

    // 묶음: 바닥은 아래로, 설비는 각자 바깥쪽 위로 떠오른다
    K.group('flare', [3.2, 1.7, -2.8]);
    K.group('columns', [.2, 2.5, -2.8]);
    K.group('cooling', [1.9, 1.4, -2.6]);
    K.group('sphere', [-3.2, 2.0, 1.5]);
    K.group('tanks', [-2.6, 1.5, -2.2]);
    K.group('reactor', [2.3, 2.0, 1.4]);
    K.group('exchangers', [3.9, 1.3, 1.9]);
    K.group('pipeRack', [0, 1.6, -.3]);
    K.group('pumps', [.4, .85, -1.0]);
    K.group('control', [-2.9, 1.2, 2.3]);
    K.group('analyzer', [.2, 1.35, 2.9], [.1, 0, 0]);
    K.group('fence', [0, -1.4, 0]);
    K.group('ground', [0, -2.6, 0]);

    // ---- 플레어 스택: 굴뚝 · 작업 발판 · 사다리 · 불꽃 끝 · 버팀줄 · 녹아웃 드럼 · 기초 ----
    const fc = V(6.0, 0, -3.4), FH = 6.0, red = [], white = [], wire = a => V(fc.x + Math.cos(a) * 1.1, 0, fc.z + Math.sin(a) * 1.1);
    for (let i = 0; i < 10; i++) {
      const y0 = i * FH / 10, y1 = y0 + FH / 10;
      (i % 2 ? white : red).push([new THREE.CylinderGeometry(.15 - .05 * (i + 1) / 10, .15 - .05 * i / 10, y1 - y0, 24, 1, true), at(fc.x, (y0 + y1) / 2, fc.z)]);
    }
    red.push([new THREE.CircleGeometry(.15, 24).rotateX(Math.PI / 2), at(fc.x, 0, fc.z)]);
    white.push([new THREE.CircleGeometry(.1, 24).rotateX(-Math.PI / 2), at(fc.x, FH, fc.z)]);
    const fring = new THREE.Shape();
    fring.absarc(0, 0, .45, 0, Math.PI * 2, false);
    fring.holes.push(circle(.15));   // 굴뚝과 파일럿 가스관이 함께 지나가는 구멍
    const FA = [0, 1, 2].map(i => Math.PI / 2 + i * Math.PI * 2 / 3);
    part('flare', 'stack', '플레어 스택', 'Flare Stack', [0, 0, 0], mesh(merge(red), M.stackRed), mesh(merge(white), M.white));
    part('flare', 'platform', '작업 발판', 'Service Platform', [0, .5, .46], mesh(merge([
      [extrude(fring, .03).rotateX(-Math.PI / 2), at(fc.x, 5.3, fc.z)],
      [new THREE.TorusGeometry(.43, .007, 4, 40).rotateX(Math.PI / 2), at(fc.x, 5.52, fc.z)],
      ...Array.from({ length: 8 }, (_, i) => [new THREE.CylinderGeometry(.006, .006, .21, 4), at(fc.x + Math.cos(i * Math.PI / 4) * .43, 5.42, fc.z + Math.sin(i * Math.PI / 4) * .43)]),
    ]), M.steel));
    part('flare', 'ladder', '사다리 · 보호 울', 'Ladder · Cage', [0, 0, .58], mesh(merge([...ladder(V(fc.x, .08, fc.z + .16), 5.2, V(1, 0, 0)), ...cage(V(fc.x, 0, fc.z + .16), 1.0, 5.25)]), M.steel));
    part('flare', 'tip', '플레어 끝 · 불꽃', 'Flare Tip', [0, .75, 0], mesh(new THREE.CylinderGeometry(.11, .1, .3, 20).translate(fc.x, FH + .15, fc.z), M.black), flame(V(fc.x, FH + .3, fc.z), 1.15));
    part('flare', 'wires', '버팀줄', 'Guy Wires', [0, 0, 0], mesh(merge(FA.map(a => [strut(V(fc.x + Math.cos(a) * .12, 4.3, fc.z + Math.sin(a) * .12), wire(a).setY(.05), .005, 4)])), M.steel));
    part('flare', 'drum', '녹아웃 드럼', 'Knock-out Drum', [-.42, .38, .48],
      mesh(vesselH(1.2, .22).translate(5.1, .42, -2.05), M.tank),
      mesh(merge([
        ...[-.35, .35].map(dx => [new THREE.BoxGeometry(.08, .2, .3), at(5.1 + dx, .1, -2.05)]),
        [pipeRun([V(5.3, .6, -2.05), V(5.3, .8, -2.05), V(5.3, .8, -3.4), V(5.86, .8, -3.4)], .04)],
      ]), M.steel));
    part('flare', 'base', '스택 기초', 'Foundations', [0, -.38, 0], mesh(merge([[new THREE.BoxGeometry(.7, .12, .7), at(fc.x, .06, fc.z)], ...FA.map(a => { const p = wire(a); return [new THREE.BoxGeometry(.14, .08, .14), at(p.x, .04, p.z)]; })]), M.concrete));
    // 점화 패널 · 파일럿 가스관: 굴뚝 뒤(−z)쪽 기둥 위 제어함에서 가는 관이 굴뚝 면을 따라 꼭대기 불꽃 끝 밑까지 올라간다
    part('flare', 'pilot', '점화 패널 · 파일럿 가스관', 'Ignition Panel · Pilot Line', [-.3, .2, -.3],
      mesh(merge([[new THREE.BoxGeometry(.04, .4, .04), at(5.5, .2, -3.62)], [rbox(.22, .28, .12, .02, .006), at(5.5, .5, -3.62)]]), M.module),
      mesh(pipeRun([V(5.61, .45, -3.62), V(6.0, .45, -3.62), V(6.0, .45, -3.566), V(6.0, FH - .05, -3.52)], .01, .03), M.steel));

    // ---- 증류탑 2기: 탑마다 몸통 · 발판 · 난간과 사다리 · 꼭대기 증기관 ----
    [[-.3, -2.95, .4, 5.4, [1.5, 2.7, 3.9, 5.1], -1], [1.15, -2.75, .3, 4.2, [1.5, 2.7, 3.9], 1]].forEach(([x, z, r, h, levels, side], i) => {
      const n = i + 1, sx = i ? .38 : -.38, shell = [], plat = [], rail = [];
      shell.push([lathe([[.001, 0], [r * 1.15, 0], [r * 1.15, .1], [r, .45], [r, h], [r * .9, h + r * .28], [r * .55, h + r * .46], [.001, h + r * .5]], 48), at(x, 0, z)]);
      for (const y of levels) {
        const s = new THREE.Shape();
        s.absarc(0, 0, r + .34, deg(-45), deg(225), false);
        s.absarc(0, 0, r + .03, deg(225), deg(-45), true);
        plat.push([extrude(s, .03).rotateX(-Math.PI / 2), at(x, y, z)]);
        rail.push([arcTube(r + .32, .007, 4, 48, deg(270)).rotateZ(deg(-45)).rotateX(-Math.PI / 2), at(x, y + .22, z)]);
        for (let a = -45; a <= 225; a += 30) rail.push([new THREE.CylinderGeometry(.006, .006, .22, 4), at(x + Math.cos(deg(a)) * (r + .32), y + .11, z - Math.sin(deg(a)) * (r + .32))]);
      }
      const lp = V(x, 0, z + r + .08), topL = levels[levels.length - 1] + .25;
      rail.push(...ladder(lp, topL, V(1, 0, 0)), ...cage(lp, 1.2, topL - .05));
      const ca = Math.cos(deg(55)), sa = Math.sin(deg(55));
      for (const y of [1.1, levels[1] + .6]) {
        shell.push([strut(V(x + ca * r * .9, y, z + sa * r * .9), V(x + ca * (r + .1), y, z + sa * (r + .1)), .07, 16)]);
        shell.push([strut(V(x + ca * (r + .1), y, z + sa * (r + .1)), V(x + ca * (r + .125), y, z + sa * (r + .125)), .095, 16)]);
      }
      const top = h + r * .5, px = x + side * (r + .45);
      shell.push([new THREE.CylinderGeometry(.075, .075, .1, 16), at(x, top + .02, z)], [new THREE.CylinderGeometry(.095, .095, .025, 16), at(x, top + .075, z)]);
      part('columns', `shell${n}`, `증류탑 ${n}`, 'Distillation Column', [sx, 0, 0], mesh(merge(shell), M.clad));
      part('columns', `plat${n}`, `증류탑 ${n} 발판`, 'Platforms', [sx, .26, .68], mesh(merge(plat), M.grate));
      part('columns', `rail${n}`, `증류탑 ${n} 난간 · 사다리`, 'Railings · Ladder', [sx, .32, 1.08], mesh(merge(rail), M.yellow));
      // 꼭대기 증기관: 옆으로 내려와 파이프 랙 위층 첫 배관(z −1.1)에 위에서 붙는다
      part('columns', `vapor${n}`, `증류탑 ${n} 증기관`, 'Overhead Vapor Line', [sx + side * .52, .52, 0], mesh(pipeRun([V(x, top, z), V(x, top + .25, z), V(px, top + .25, z), V(px, 1.9, z), V(px, 1.9, -1.1), V(px, 1.76, -1.1)], .05), M.clad));
    });
    // 리보일러: 증류탑 1 밑동 옆 누운 열교환기 (탑 바닥 액체를 받아 데운 뒤 증기를 탑으로 돌려보낸다)
    part('columns', 'reboiler', '리보일러', 'Reboiler', [-.5, .2, 0],
      mesh(vesselH(.7, .16).translate(-1.25, .45, -2.95), M.module),
      mesh(merge([
        ...[-1.5, -1.0].map(x => [new THREE.BoxGeometry(.08, .29, .26), at(x, .145, -2.95)]),
        [pipeRun([V(-1.1, .6, -2.95), V(-1.1, .8, -2.95), V(-.69, .8, -2.95)], .035, .06)],
        [pipeRun([V(-.815, .45, -2.95), V(-.69, .45, -2.95)], .035)],
      ]), M.steel));
    // 환류 드럼: 증류탑 2 옆 받침 위 누운 용기. 윗관이 파이프 랙 아래층 첫 배관에 위에서 붙는다
    part('columns', 'reflux', '환류 드럼', 'Reflux Drum', [.5, .3, 0],
      mesh(vesselH(.7, .18).rotateY(Math.PI / 2).translate(1.85, .5, -3.0), M.tank),
      mesh(merge([
        ...[-.25, .25].map(dz => [new THREE.BoxGeometry(.3, .32, .08), at(1.85, .16, -3.0 + dz)]),
        [pipeRun([V(1.85, .67, -2.9), V(1.85, 1.15, -2.9), V(1.85, 1.15, -1.12), V(1.85, 1.085, -1.12)], .03, .08)],
      ]), M.steel));

    // ---- 냉각탑: 몸통 · 기초 · 앞뒤 루버 · 팬 굴뚝 · 계단 · 지붕 난간 · 냉각수 배관 ----
    const tcx = 3.3, tcz = -3.15, tw = 2.2, td = 1.2, tH = 1.1, ttop = .12 + tH;
    part('cooling', 'body', '냉각탑 몸통', 'Cooling Tower', [0, 0, 0], mesh(rbox(tw, tH, td, .03, .01).translate(tcx, .12 + tH / 2, tcz), M.tower));
    part('cooling', 'base', '냉각탑 물받이 기초', 'Basin', [0, -.32, 0], mesh(new THREE.BoxGeometry(tw + .16, .12, td + .16).translate(tcx, .06, tcz), M.concrete));
    for (const s of [1, -1]) part('cooling', s > 0 ? 'louverF' : 'louverB', `${s > 0 ? '앞' : '뒤'} 통풍 루버`, 'Louvers', [0, 0, s * .46],
      mesh(merge(Array.from({ length: 6 }, (_, i) => [new THREE.BoxGeometry(tw - .2, .03, .015), at(tcx, .3 + i * .12, tcz + s * (td / 2 + .004))])), M.black));
    part('cooling', 'fans', '팬 굴뚝', 'Fan Stacks', [0, .68, 0],
      mesh(merge([-.55, .55].map(dx => [lathe([[.4, 0], [.34, .36], [.335, .36], [.335, 0], [.4, 0]], 32), at(tcx + dx, ttop, tcz)])), M.tower),
      mesh(merge([-.55, .55].map(dx => [liner(.33, ttop + .02, ttop + .36), at(tcx + dx, 0, tcz)])), MAT.lining),
      mesh(merge([-.55, .55].map(dx => [new THREE.CylinderGeometry(.32, .32, .01, 32), at(tcx + dx, ttop + .215, tcz)])), M.black));
    part('cooling', 'stair', '냉각탑 계단', 'Stair', [.58, 0, 0], mesh(merge([...stair(V(tcx + tw / 2 + .15, 0, tcz + .7), V(tcx + tw / 2 + .15, ttop, tcz - .45)), [new THREE.BoxGeometry(.3, .02, .25), at(tcx + tw / 2 + .12, ttop - .01, tcz - .55)]]), M.steel));
    part('cooling', 'rails', '냉각탑 지붕 난간', 'Roof Railing', [0, .42, 0], mesh(merge(rails(tcx - tw / 2 + .03, tcx + tw / 2 - .03, tcz - td / 2 + .03, tcz + td / 2 - .03, ttop)), M.yellow));
    part('cooling', 'pipes', '냉각수 배관', 'Cooling Water Lines', [0, .32, .58],
      mesh(merge([2.9, 3.7].map(x => [pipeRun([V(x, .3, tcz + td / 2 - .01), V(x, .3, -1.12), V(x, .985, -1.12)], .045)])), M.green),
      mesh(new THREE.BoxGeometry(1.1, .25, .1).translate(3.3, .125, -1.85), M.concrete));
    // 냉각수 펌프: 냉각수 배관 두 줄 중간에 끼운 펌프(케이스가 관을 감싼다) + 위 모터 + 받침
    part('cooling', 'cwPumps', '냉각수 펌프', 'Cooling Water Pumps', [0, .32, .3], mesh(merge([[2.9, -2.2], [3.7, -1.55]].flatMap(([x, z]) => [
      [new THREE.BoxGeometry(.3, .06, .34), at(x, .03, z)],
      [new THREE.BoxGeometry(.1, .16, .1), at(x, .14, z)],
      [new THREE.CylinderGeometry(.085, .085, .2, 20).rotateX(Math.PI / 2), at(x, .3, z)],
      [new THREE.CylinderGeometry(.07, .07, .22, 16), at(x, .495, z)],
    ])), M.blue));

    // ---- 구형 가스 탱크: 공 모양 용기(적도 띠 포함) · 다리와 가새 · 꼭대기 계단참 · 가스 배관 ----
    const sc = V(-5.5, 1.45, 1.55), SR = .85, sst = [];
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + Math.PI / 6, b = a + Math.PI / 3;
      const p = V(sc.x + Math.cos(a) * SR, 0, sc.z + Math.sin(a) * SR), q = V(sc.x + Math.cos(b) * SR, 0, sc.z + Math.sin(b) * SR);
      sst.push([strut(p, p.clone().setY(sc.y), .045, 10)], [new THREE.CylinderGeometry(.09, .09, .06, 12), at(p.x, .03, p.z)]);
      sst.push([strut(p.clone().setY(.12), q.clone().setY(.95), .012, 5)], [strut(q.clone().setY(.12), p.clone().setY(.95), .012, 5)]);
    }
    const stop = sc.y + SR;
    // 계단 방향: 북쪽(−z)에서 조금 동쪽. 다리(270° · 330°) 사이로 올라와 공 표면을 따라 꼭대기 계단참에 닿는다
    const sh = V(.4, 0, -.85).normalize(), sAng = Math.atan2(sh.z, sh.x);
    const sArc = f => V(sc.x + sh.x * (SR + .07) * Math.cos(f), sc.y + (SR + .07) * Math.sin(f), sc.z + sh.z * (SR + .07) * Math.cos(f));
    part('sphere', 'shell', '구형 가스 탱크', 'Spherical Tank', [0, .46, 0], mesh(new THREE.SphereGeometry(SR, 48, 32).translate(sc.x, sc.y, sc.z), M.tank), mesh(new THREE.TorusGeometry(SR + .01, .022, 6, 64).rotateX(Math.PI / 2).translate(sc.x, sc.y, sc.z), M.steel));
    part('sphere', 'legs', '탱크 다리 · 가새', 'Legs · Bracing', [0, -.16, 0], mesh(merge(sst), M.steel));
    // 꼭대기 계단참: 계단이 올라오는 자리의 난간(고리 · 기둥)은 비운다
    part('sphere', 'platform', '꼭대기 계단참', 'Top Platform', [0, 1.08, 0], mesh(merge([
      [new THREE.CylinderGeometry(.24, .24, .03, 24), at(sc.x, stop + .015, sc.z)],
      [arcTube(.23, .006, 4, 32, Math.PI * 2 - 1.1).rotateX(Math.PI / 2).rotateY(-(sAng + .55)), at(sc.x, stop + .2, sc.z)],
      ...Array.from({ length: 8 }, (_, i) => i * Math.PI / 4).filter(a => Math.abs(Math.atan2(Math.sin(a - sAng), Math.cos(a - sAng))) > .62)
        .map(a => [new THREE.CylinderGeometry(.005, .005, .18, 4), at(sc.x + Math.cos(a) * .23, stop + .11, sc.z + Math.sin(a) * .23)]),
    ]), M.yellow));
    // 구형 탱크 계단: 땅에서 적도 높이 계단참까지 곧은 경사 계단 → 공 표면을 따라 휘어 오르는 계단 6토막 → 꼭대기 계단참
    part('sphere', 'stair', '구형 탱크 계단', 'Sphere Stair', [.1, .75, -.5], mesh(merge([
      ...stair(V(sc.x + .4, 0, -.2), V(sc.x + .4, sc.y, .7), .15),
      [new THREE.BoxGeometry(.2, .02, .2), at(sc.x + .4, sc.y - .01, .72)],
      ...[0, 1, 2, 3, 4, 5].flatMap(i => stair(sArc(deg(i * 76 / 6)), sArc(deg((i + 1) * 76 / 6)), .14)),
    ]), M.steel));
    part('sphere', 'pipe', '가스 배관', 'Gas Line', [.46, .1, .42], mesh(pipeRun([V(sc.x, sc.y - SR + .03, sc.z), V(sc.x, .25, sc.z), V(sc.x, .25, .35), V(sc.x + .6, .25, .35), V(sc.x + .6, 1.05, .35), V(sc.x + .6, 1.05, -1.15)], .04), M.pipe));

    // ---- 저장 탱크 2기: 탱크마다 몸통(거품 소화 장치 포함) · 나선 계단 · 지붕 난간과 통기구, 방류벽 · 출구관 ----
    TANKS.forEach(([x, z], i) => {
      const s = i ? 1 : -1, n = i + 1;
      part('tanks', `shell${n}`, `저장 탱크 ${n}`, 'Storage Tank', [s * .42, .16, 0],
        mesh(lathe([[.001, 0], [TR, 0], [TR, TH], [TR * .82, TH + .12], [TR * .45, TH + .2], [.001, TH + .23]], 64).translate(x, .05, z), M.tank),
        mesh(merge([deg(40), deg(75)].map(a => [rbox(.1, .12, .08, .02, .006), TM(V(x + Math.cos(a) * (TR + .04), TH - .15, z + Math.sin(a) * (TR + .04)), Q(0, Math.PI / 2 - a, 0))])), M.stackRed));
      part('tanks', `stair${n}`, `탱크 ${n} 나선 계단`, 'Spiral Stair', [s * .42, .16, .62], mesh(merge(spiralStair(V(x, .05, z), TR, TH, deg(10), deg(150))), M.steel));
      part('tanks', `roof${n}`, `탱크 ${n} 지붕 난간 · 통기구`, 'Roof Railing · Vent', [s * .42, .82, 0], mesh(merge([
        [new THREE.TorusGeometry(TR, .014, 6, 64).rotateX(Math.PI / 2), at(x, TH + .05, z)],
        [new THREE.CylinderGeometry(.05, .05, .16, 12), at(x + .3, TH + .31, z)],
        ...Array.from({ length: 16 }, (_, k) => { const a = k / 16 * Math.PI * 2; return [new THREE.CylinderGeometry(.005, .005, .15, 4), at(x + Math.cos(a) * TR * .96, TH + .16, z + Math.sin(a) * TR * .96)]; }),
        [new THREE.TorusGeometry(TR * .96, .006, 4, 64).rotateX(Math.PI / 2), at(x, TH + .235, z)],
      ]), M.steel));
    });
    part('tanks', 'dike', '방류벽 · 탱크 기초', 'Dike Wall · Foundations', [0, -.32, 0], mesh(merge([
      ...[-4.25, -1.55].map(z => [new THREE.BoxGeometry(4.98, .24, .08), at(-4.2, .12, z)]),
      ...[-6.65, -1.75].map(x => [new THREE.BoxGeometry(.08, .24, 2.62), at(x, .12, -2.9)]),
      ...TANKS.map(([x, z]) => [new THREE.CylinderGeometry(TR + .06, TR + .06, .05, 48), at(x, .025, z)]),
    ]), M.concrete));
    // 거품 소화 배관: 탱크 윗벽의 거품 방출구(빨간 상자)에서 나선 계단 바깥쪽으로 내려와, 방류벽을 지나 땅속 소화 주관으로 들어간다
    part('tanks', 'foam', '거품 소화 배관', 'Foam Lines', [0, .3, .6], mesh(merge(TANKS.flatMap(([x, z]) => [deg(40), deg(75)].map(a => {
      const c = Math.cos(a), s = Math.sin(a), px = x + c * 1.15, pz = z + s * 1.15;

  // ---------- 제품 조립: 부품을 만들고 조립·분해 자리를 계산한다 ----------
  let mode = 'wide';
  function build(def) {
    const root = new THREE.Group();
    root.visible = false;
    stage.add(root);
    const toStage = v => v.applyQuaternion(def.asm.q).add(def.asm.p);
    const parts = def.spec.map(({ key, pos, q, boom, group: grp }, i) => {
      const t = def.types.findIndex(x => x.key === key);
      const obj = def.types[t].build();
      // 현장 모델: 무늬 재질을 쓰는 면은 월드 좌표로 UV를 매긴다 (아직 제자리 좌표일 때)
      if (def.box) obj.traverse(o => { const w = o.isMesh && o.material.map && o.material.map.worldScale; if (w) worldUV(o.geometry, w); });
      const box = bounds(obj), c = box.getCenter(V()), size = box.getSize(V());
      obj.children.forEach(ch => ch.position.sub(c));
      box.translate(c.clone().negate());
      obj.add(mesh(new THREE.BoxGeometry(Math.max(size.x + .12, .22), Math.max(size.y + .12, .22), Math.max(size.z + .12, .22)), HIT));
      const off = c.clone().applyQuaternion(q);
      const A = { p: toStage(pos.clone().add(off)), q: def.asm.q.clone().multiply(q), s: 1 };
      const pt = {
        key, t, def, group: grp, obj, box, c, q0: q, r: size.length() / 2, k: 0, gk: 0, gn: 1,
        A, B: toStage(pos.clone().add(boom).add(off)),
        p: A.p.clone(), q: A.q.clone(), s: 1, h: 0, a: 1, mats: [], look: new THREE.Quaternion(), phase: i * 1.7, tw: null,
      };
      // 부품마다 재질을 따로 가져야 그 부품만 투명하게 사라지게 할 수 있다.
      // 박스 부품은 가장 큰 덩어리의 재질로 소리 갈래(pt.snd)를 정한다 (덩어리 크기 = 감싸는 공 반지름³)
      const kinds = {};
      obj.traverse(o => {
        o.userData.part = pt;
        if ((o.isMesh || o.isSprite) && o.material !== HIT) {
          const kd = !def.box && o.isMesh && MAT_SOUND.get(o.material);
          if (kd) {
            if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
            kinds[kd] = (kinds[kd] || 0) + o.geometry.boundingSphere.radius ** 3 * (o.isInstancedMesh ? o.count : 1);
          }
          o.material = o.material.clone();
          o.material.userData.base = o.material.opacity;
          pt.mats.push(o.material);
        }
      });
      pt.snd = Object.keys(kinds).sort((a, b) => kinds[b] - kinds[a])[0] || 'metal';
      root.add(obj);
      return pt;
    });
    for (const pt of parts) {
      const same = parts.filter(p => p.key === pt.key), sib = same.filter(p => p.group === pt.group);
      pt.k = same.indexOf(pt);
      pt.gk = sib.indexOf(pt);
      pt.gn = sib.length;
    }
    // 현장: 묶음마다 가운데를 구하고, 부품마다 분해 자리(묶음 이동 + 묶음 안 벌어짐)와 반해체 자리(묶음 안에서만 벌어진 자리)를 정한다
    if (def.fieldParts) {
      const gb = {};
      for (const pt of parts) (gb[pt.group] = gb[pt.group] || new THREE.Box3()).union(pt.box.clone().translate(pt.c));
      def.explode = {};
      // spread = 묶음 안에서 벌어지는 거리 배율, far = 묶음끼리 멀어지는 거리 배율 (부품이 많아 뭉쳐 보이지 않게 크게 벌린다)
      for (const pt of parts) {
        const src = def.parts[pt.t], g = def.groups[pt.group];
        const ex = (src.ex ? V(...src.ex) : pt.c.clone().sub(gb[pt.group].getCenter(V())).multiplyScalar(.45)).multiplyScalar(def.spread ?? 1);
        def.explode[pt.key] = { p: V(...g.drift).multiplyScalar(def.far ?? 1).add(ex), r: g.tilt };
        pt.B = pt.A.p.clone().add(ex.clone().multiplyScalar(1.15).add(V(0, .1, 0)).applyQuaternion(def.asm.q));
      }
    }
    const boxAt = (pt, ps) => pt.box.clone().applyMatrix4(TM(ps.p, ps.q, ps.s));
    // 자동 배치: 부품을 순서대로 한 줄에 채우다가 폭이 넘치면(또는 새 묶음이면) 다음 줄로 넘긴다
    // 'key#n' = 같은 부품 중 n번째 하나만 (왼쪽 것은 왼쪽 칸, 오른쪽 것은 오른쪽 칸에 두어 날아가는 길이 엇갈리지 않게)

    }
    if (el.closest('#picker') || homeOn || trans) return;
    // 개발자 명령: 왼쪽 Ctrl을 1초 안에 5번 연속 누르면 이 현장의 이스터에그를 바로 실행 (테스트용, 30초 대기를 건너뜀)
    if (e.code === 'ControlLeft') {
      const now = performance.now();
      escCount = now - escAt < 1000 ? escCount + 1 : 1;
      escAt = now;
      if (escCount >= 5) {
        escCount = 0;
        if (isField(cur) && state === 'assembled' && !egg) { delete eggSeen[cur.def.key]; startEgg(cur.def.key); }
      }
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && !el.closest('button')) {
      e.preventDefault();
      if (state === 'assembled') explode(); else if (state === 'site') enterProduct(); else if (!focused) step(1);
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      if (state !== 'assembled') step(e.key === 'ArrowRight' ? 1 : -1);
    } else if (e.key === 'Escape') {
      if (state === 'site') leaveSite(); else unfocus();
    }
  });
  $('act').addEventListener('click', () => (state === 'assembled' ? explode() : assemble()));
  $('back').addEventListener('click', () => (state === 'site' ? leaveSite() : unfocus()));
  $('to-ship').addEventListener('click', () => backToSite());
  // 처음으로: 지나온 길을 거꾸로 되짚어 메인 화면까지
  $('to-start').addEventListener('click', goHome);
  // 소리: 오른쪽 위 스피커 버튼으로 켜고 끈다. 브라우저 규칙상 첫 누름·키 입력에서 소리를 깨운다(그 전에는 조용)
  const snd = $('snd');
  const sndUi = () => { snd.classList.toggle('off', !SFX.on); snd.setAttribute('aria-pressed', String(SFX.on)); snd.title = SFX.on ? '소리 끄기' : '소리 켜기'; };
  snd.addEventListener('click', () => { SFX.toggle(); sndUi(); });
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'keydown']) addEventListener(ev, () => SFX.wake(), true);
  document.addEventListener('visibilitychange', () => SFX.pause(document.hidden));
  sndUi();
  // 메인 화면의 세 칸: 마우스를 올리면 그 현장이 살짝 다가오며 기울고, 누르면 그 현장으로 들어간다
  homeEl.addEventListener('pointermove', e => { px = e.clientX / innerWidth; py = e.clientY / innerHeight; });
  homeEl.querySelectorAll('.panel').forEach((b, i) => {
    let skip = false;
    b.addEventListener('pointerdown', () => { skip = menuOpen(); });   // 메뉴를 닫으려고 누른 것이면 들어가지 않는다
    b.addEventListener('pointerenter', () => { homeHover = i; });
    b.addEventListener('pointerleave', () => { if (homeHover === i) homeHover = -1; });
    b.addEventListener('focus', () => { homeHover = i; });
    b.addEventListener('blur', () => { if (homeHover === i) homeHover = -1; });
    b.addEventListener('click', () => { if (skip) { skip = false; return; } enterFromMain(i); });
  });
  $('choice').addEventListener('click', () => goSite($('choice').dataset.site));
  $('choice').addEventListener('pointerenter', () => { if (isField(cur) && state === 'exploded') hovered = hostOf(cur.def.box); });
  $('choice').addEventListener('pointerleave', () => { hovered = null; });
  document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => step(+b.dataset.step)));
  $('title').addEventListener('click', () => setMenu(!menuOpen()));
  document.addEventListener('pointerdown', e => { if (menuOpen() && !picker.contains(e.target)) setMenu(false); });
  document.querySelectorAll('[data-product]').forEach(b => b.addEventListener('click', () => { setMenu(false); select(b.dataset.product); }));
  addEventListener('hashchange', () => select(fromHash()));

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    zoom = null;
    pan.set(0, 0, 0);
    const m = camera.aspect < .85 ? 'tall' : 'wide';
    if (m !== mode) {
      mode = m;
      if (cur && state !== 'assembled') cur.parts.forEach(pt => pt !== focused && tween(pt, C(pt), { dur: 700 }));
    }
    if (cur && focused) tween(focused, focusPose(focused), { dur: 400 });
    measureHead();
  }
  addEventListener('resize', resize);

  mode = innerWidth / innerHeight < .85 ? 'tall' : 'wide';
  resize();
  select(fromHash());
  // 로딩창 닫기: 첫 화면이 실제로 그려지면(다음다음 프레임) 불러오기 끝 → loader가 로고를 마저 조립하고 나면 .hide → CSS가 .25초 보여 준 뒤 부드럽게 지운다.
  // 움직임 줄이기면 로고 애니메이션이 없어 기다리지 않는다
  const loadEl = $('loading');
  new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res))).then(loader.finish).then(() => {
    const covered = getComputedStyle(loadEl).display !== 'none';   // 검사 도구처럼 로딩창을 아예 숨긴 경우엔 장면을 건드리지 않는다
    loadEl.classList.add('hide');
    if (!covered) return;
    idleAt = performance.now();   // 이스터에그 30초는 장면이 보이기 시작한 때부터 센다
    // 로딩창 뒤에서 이미 끝나 버린 첫 등장(카메라가 다가오며 살짝 돌아 들어오는 것)을, 로딩창이 걷힐 때 다시 보여 준다
    if (cam && !homeOn && !reduced) { cam.d = zoomGoal(panGoal(camGoal())).d * 1.35; stage.rotation.y = -.7; }
  });
  requestAnimationFrame(frame);
});
</script>
